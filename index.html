<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dallas Avenue - Boutique</title>
<style>
:root{--gold:#c9a227;--gold-light:#f3e7c4;--black:#111;--bg:#f7f5f0;--border:#e3ddc9;--muted:#7a766a;--green:#2f7d4f;--danger:#a3352f;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--black);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:90px;}
header{background:var(--black);color:var(--gold);padding:14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;}
header img{width:44px;height:44px;border-radius:50%;}
header h1{margin:0;font-size:18px;letter-spacing:1px;}
header .s{font-size:12px;color:#d8c98a;margin-top:2px;}
.wrap{max-width:900px;margin:0 auto;padding:0 14px;}
.search{margin:14px 0;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:#fff;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.card .ph{aspect-ratio:1/1;background:var(--gold-light);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:34px;}
.card img{width:100%;height:100%;object-fit:cover;display:block;}
.card .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card .n{font-size:14px;font-weight:600;line-height:1.25;}
.card .p{color:#8a6d0e;font-weight:700;font-size:15px;}
.btn{border:0;border-radius:10px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;background:var(--black);color:var(--gold);width:100%;}
.btn.wa{background:#25D366;color:#fff;font-size:16px;padding:14px;}
.btn:disabled{background:#ccc;color:#fff;}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:20px;cursor:pointer;}
.qty span{font-weight:700;min-width:24px;text-align:center;}
.out{font-size:12px;color:var(--danger);font-weight:600;}
.empty{text-align:center;color:var(--muted);padding:40px 10px;}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--black);color:var(--gold);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;z-index:30;}
.bar.show{display:flex;}
.bar button{background:var(--gold);color:var(--black);border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;}
.sheet.show{display:block;}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px 24px;max-width:600px;margin:0 auto;}
.panel h2{margin:0 0 10px;font-size:18px;}
.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:12px 0;}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;}
input[type=text],input[type=tel],textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;}
.x{float:right;background:none;border:0;font-size:24px;cursor:pointer;}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px;}
</style>
</head>

  fetch('boutique.json?t='+Date.now()).then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(d){ DATA = d; if(!DATA.whatsapp) DATA.whatsapp='22371747415'; restore(); render(); refresh(); })
  .catch(function(){ document.getElementById('list').innerHTML='<div class="empty" style="grid-column:1/-1">La boutique n\'est pas encore disponible. Revenez bientôt !</div>'; });
}
function restore(){
  try{ var c = JSON.parse(localStorage.getItem('da_cart')||'{}'); Object.keys(c).forEach(function(id){ var p=byId(id); if(p && p.dispo && c[id]>0) cart[id]=c[id]; }); }catch(e){}
}
function save(){ try{ localStorage.setItem('da_cart', JSON.stringify(cart)); }catch(e){} }
function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var items = DATA.produits.filter(function(p){ return !q || p.nom.toLowerCase().indexOf(q)>=0; });
  var el = document.getElementById('list');
  if(!items.length){ el.innerHTML='<div class="empty" style="grid-column:1/-1">Aucun produit trouvé.</div>'; return; }
  el.innerHTML = items.map(function(p){
    var n = cart[p.id]||0;
    var img = p.photo ? '<img src="'+p.photo+'" alt="">' : '&#10022;';
    var action = !p.dispo ? '<div class="out">Épuisé</div>'
      : (n>0 ? '<div class="qty"><button onclick="chg(\''+p.id+'\',-1)">&minus;</button><span>'+n+'</span><button onclick="chg(\''+p.id+'\',1)">+</button></div>'
             : '<button class="btn" onclick="chg(\''+p.id+'\',1)">Ajouter</button>');
    return '<div class="card"><div class="ph">'+img+'</div><div class="b"><div class="n">'+esc(p.nom)+'</div><div class="p">'+fmt(p.prix)+'</div>'+action+'</div></div>';
  }).join('');
}
function chg(id,d){
  var n = (cart[id]||0)+d;
  if(n<=0) delete cart[id]; else cart[id]=n;
  save(); render(); refresh(); if(document.getElementById('sheet').classList.contains('show')) drawCart();
}
function totals(){
  var n=0,t=0;
  Object.keys(cart).forEach(function(id){ var p=byId(id); if(p){ n+=cart[id]; t+=cart[id]*p.prix; } });
  return {n:n,t:t};
}
function refresh(){
  var x = totals();
  document.getElementById('bar').classList.toggle('show', x.n>0);
  document.getElementById('barN').textContent = x.n+' article'+(x.n>1?'s':'');
  document.getElementById('barT').textContent = fmt(x.t);
}
function drawCart(){
  var ids = Object.keys(cart).filter(function(id){return byId(id);});
  document.getElementById('lines').innerHTML = ids.map(function(id){
    var p=byId(id);
    return '<div class="line"><div>'+esc(p.nom)+'<div style="color:#7a766a;font-size:12px;">'+fmt(p.prix)+' &times; '+cart[id]+'</div></div>' +
      '<div style="text-align:right;"><b>'+fmt(p.prix*cart[id])+'</b><div class="qty" style="margin-top:4px;"><button onclick="chg(\''+id+'\',-1)">&minus;</button><span>'+cart[id]+'</span><button onclick="chg(\''+id+'\',1)">+</button></div></div></div>';
  }).join('');
  document.getElementById('total').textContent = fmt(totals().t);
  if(!ids.length) closeCart();
}
function openCart(){ drawCart(); document.getElementById('sheet').classList.add('show'); }
function closeCart(){ document.getElementById('sheet').classList.remove('show'); }
function envoyer(){
  var nom = document.getElementById('nom').value.trim();
  var tel = document.getElementById('tel').value.trim();
  var mode = document.getElementById('mode').value;
  var adr = document.getElementById('adr').value.trim();
  var note = document.getElementById('note').value.trim();
  if(!nom){ alert('Merci d\'indiquer votre nom.'); return; }
  if(!tel){ alert('Merci d\'indiquer votre numéro de téléphone.'); return; }
  if(mode==='Livraison' && !adr){ alert('Merci d\'indiquer votre quartier / adresse pour la livraison.'); return; }
  var ids = Object.keys(cart).filter(function(id){return byId(id);});
  if(!ids.length) return;
  var m = '*Nouvelle commande - Dallas Avenue*\n\n';
  ids.forEach(function(id){ var p=byId(id); m += '- '+p.nom+' x'+cart[id]+' = '+fmt(p.prix*cart[id])+'\n'; });
  m += '\n*TOTAL : '+fmt(totals().t)+'*\n\n';
  m += 'Nom : '+nom+'\nTél : '+tel+'\n'+mode+(adr?' : '+adr:'')+'\n';
  if(note) m += 'Précisions : '+note+'\n';
  window.open('https://wa.me/'+DATA.whatsapp+'?text='+encodeURIComponent(m), '_blank');
}
load();
</script>
</body>
