<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.d2-fc{aspect-ratio:4/5;background:#1c1810;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:44px;}
.d2-fc>div{z-index:1;}
</style></head><body>
<title>Dallas Avenue Boutique</title>
<meta name="description" content="Dallas Avenue, institut de beauté et produits bien-être à Nioro du Sahel.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600&family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&family=Jost:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;600;800&family=Marcellus&family=Nunito:wght@400;600;700&family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Rozha+One&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* ===== Base commune (tokens définis par design plus bas) ===== */
:root{--sw:0px;--bg:#f6f2ea;--fg:#16140f;--muted:#7b7467;--line:#ddd5c4;--accent:#b08d2a;--btn-bg:#16140f;--btn-fg:#f6f2ea;--card:#fff;--radius:12px;--fd:Georgia,serif;--fb:system-ui,sans-serif;--wa-bg:#1f9d55;--wa-fg:#fff;--danger:#a3352f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;padding-top:var(--sw);padding-bottom:84px;}
button{font-family:inherit;color:inherit;}
img{max-width:100%;}
a{color:inherit;}
.ic{display:block;flex:none;}
.noimg{font-size:34px;color:var(--accent);}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--btn-bg);color:var(--btn-fg);padding:13px 20px;font-weight:600;font-size:15px;cursor:pointer;border-radius:var(--radius);text-decoration:none;}
.btn.on{outline:2px solid var(--accent);outline-offset:2px;}
.btn.wa{background:var(--wa-bg);color:var(--wa-fg);width:100%;padding:15px;font-size:16px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.old{color:var(--muted);font-weight:400;margin-right:6px;text-decoration:line-through;}
.soldout{color:var(--danger);font-weight:700;font-size:13px;}
/* sélecteur d'aperçu */
#sw{position:fixed;left:0;right:0;top:0;z-index:100;height:var(--sw);background:#0b0b0b;border-bottom:1px solid #333;display:none;align-items:center;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none;}
#sw::-webkit-scrollbar{display:none;}
#sw span{color:#8e8a7a;font:600 11px/1 system-ui;letter-spacing:1px;text-transform:uppercase;flex:none;margin-right:2px;}
#sw button{flex:none;border:1px solid #444;background:#1a1a1a;color:#e8dfc4;border-radius:999px;padding:7px 12px;font:600 12.5px/1 system-ui;cursor:pointer;white-space:nowrap;}
#sw button.on{background:#e6c65c;color:#1a1400;border-color:#e6c65c;}
/* barre panier */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--btn-bg);color:var(--btn-fg);padding:12px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;}
.bar.show{display:flex;}
.bar b{font-size:18px;}
.bar small{display:block;opacity:.7;font-size:12px;}
.bar button{background:var(--accent);color:#16120a;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;}
/* feuilles */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;}
.sheet.show{display:block;}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:93vh;overflow:auto;background:var(--card);color:var(--fg);border-radius:20px 20px 0 0;padding:20px 18px 28px;max-width:560px;margin:0 auto;font-family:var(--fb);}
.panel h2{margin:0 0 10px;font-family:var(--fd);font-size:22px;font-weight:600;}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font-size:22px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.dph{margin:-20px -18px 14px;height:min(100vw,42vh,420px);min-height:240px;background:#efe5c8;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:20px 20px 0 0;}
.dph img{width:100%;height:100%;object-fit:cover;}
.dcat{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;}
.dprice{font-size:22px;font-weight:700;margin:6px 0 10px;}
.ddesc{color:var(--muted);line-height:1.6;margin:0 0 12px;}
.vg{margin:12px 0;}
.vl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600;}
.vo{display:flex;flex-wrap:wrap;gap:8px;}
.vo button{min-width:46px;padding:9px 14px;border:1px solid var(--line);background:transparent;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;}
.vo button.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:20px;cursor:pointer;}
.qty span{font-weight:700;min-width:28px;text-align:center;}
.line{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
.line small{color:var(--muted);display:block;}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:20px;margin:14px 0;}
.panel label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px;letter-spacing:.5px;}
.panel input[type=text],.panel input[type=tel],.panel textarea,.panel select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--fg);}
.err{color:var(--danger);font-size:13px;margin-top:8px;font-weight:600;}
.okbox{text-align:center;padding:8px 0;}
.okbox .big{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#16120a;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.okbox .num{font-family:var(--fd);font-size:22px;margin:6px 0 10px;}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(16px);bottom:96px;background:var(--btn-bg);color:var(--btn-fg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:120;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.cn{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#16120a;font-size:11px;font-weight:800;padding:0 5px;}
.cn.hide{display:none;}
.how ol{list-style:none;margin:0;padding:0;counter-reset:st;}
.how li{counter-increment:st;}
.how li b{display:block;}
.how li span{color:var(--muted);font-size:14px;}
.ft{text-align:center;padding:36px 20px 44px;}
.ft p{margin:4px 0;font-size:13.5px;display:flex;gap:6px;align-items:center;justify-content:center;}
.ft-t{letter-spacing:4px;font-size:18px;font-family:var(--fd);}
.ft-s{font-style:italic;margin:6px 0 14px;opacity:.85;}
.ft-n{opacity:.7;margin-top:12px!important;font-size:12.5px!important;}
.tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:5px 9px;z-index:2;}
.tag.out{color:var(--danger);}
.qk{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;}

/* ===== 1 · MAISON (ivoire, noir, filet d'or) ===== */
body[data-d="1"]{--bg:#f6f2ea;--fg:#16140f;--muted:#7b7467;--line:#ddd5c4;--accent:#b08d2a;--btn-bg:#16140f;--btn-fg:#f6f2ea;--card:#f6f2ea;--radius:0px;--fd:"Cormorant Garamond",Georgia,serif;--fb:"Jost",system-ui,sans-serif;--wa-bg:#16140f;--wa-fg:#f6f2ea;}
.d1-top{position:sticky;top:var(--sw);z-index:30;background:rgba(246,242,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.d1-in{max-width:1040px;margin:0 auto;padding:12px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;}
.d1-brand{display:flex;align-items:center;gap:10px;justify-content:center;}
.d1-brand img{width:30px;height:30px;border-radius:50%;}
.d1-brand b{font-family:var(--fd);font-weight:500;letter-spacing:5px;font-size:17px;}
@media(max-width:520px){.d1-brand img{display:none}.d1-brand b{letter-spacing:3px;font-size:15px;white-space:nowrap}.d1-link{letter-spacing:1px;font-size:11px}}
.d1-link{font-size:12px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;}
.d1-bag{justify-self:end;background:none;border:0;display:flex;gap:6px;align-items:center;cursor:pointer;padding:6px;}
.d1-hero{text-align:center;padding:72px 24px 64px;}
.d1-eyebrow{font-size:11.5px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin:0 0 22px;}
.d1-hero h1{font-family:var(--fd);font-weight:300;font-size:clamp(40px,11vw,76px);line-height:1.02;margin:0;}
.d1-hero h1 em{font-style:italic;color:var(--accent);}
.d1-rule{display:block;width:48px;height:1px;background:var(--accent);margin:28px auto 22px;}
.d1-more{font-size:12px;letter-spacing:3px;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--fg);padding-bottom:4px;cursor:pointer;}
.d1-search{max-width:1040px;margin:0 auto;padding:0 16px;}
.d1-search input{width:100%;border:0;border-bottom:1px solid var(--fg);background:transparent;padding:12px 2px;font:400 16px var(--fb);outline:none;}
.d1-tabs{display:flex;gap:26px;overflow-x:auto;padding:20px 16px 8px;max-width:1040px;margin:0 auto;scrollbar-width:none;}
.d1-tabs button{flex:none;background:none;border:0;border-bottom:1px solid transparent;padding:4px 0 6px;font:400 13px var(--fb);letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;}
.d1-tabs button.on{color:var(--fg);border-color:var(--fg);}
.d1-grid{max-width:1040px;margin:0 auto;padding:18px 16px 10px;display:grid;grid-template-columns:repeat(2,1fr);gap:30px 14px;}
@media(min-width:760px){.d1-grid{grid-template-columns:repeat(3,1fr);gap:44px 22px;}}
.d1-ph{position:relative;aspect-ratio:4/5;background:#ebe4d4;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.d1-ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s;}
.d1-ph:hover img{transform:scale(1.03);}
.d1 .tag,.d1-ph .tag{background:rgba(246,242,234,.92);color:var(--fg);font-weight:500;letter-spacing:2px;font-size:10px;}
.d1-info{padding-top:12px;text-align:center;}
.d1-info small{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.d1-info h3{font-family:var(--fd);font-weight:500;font-size:20px;line-height:1.15;margin:4px 0 6px;cursor:pointer;}
.d1-price{font-size:14px;letter-spacing:.5px;}
.d1-add{margin-top:10px;background:none;border:0;border-bottom:1px solid var(--fg);padding:2px 0;font:400 11.5px var(--fb);letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.d1-add.on{color:var(--accent);border-color:var(--accent);}
.d1-how{max-width:1040px;margin:50px auto 0;padding:46px 16px;border-top:1px solid var(--line);text-align:center;}
.d1-how h2{font-family:var(--fd);font-weight:300;font-size:30px;margin:0 0 26px;}
.d1-how ol{display:grid;gap:22px;}
@media(min-width:700px){.d1-how ol{grid-template-columns:repeat(3,1fr);}}
.d1-how li::before{content:counter(st,upper-roman);font-family:var(--fd);font-style:italic;font-size:28px;color:var(--accent);display:block;}
.d1-ft{border-top:1px solid var(--line);}

/* ===== 2 · NOIR & OR ===== */
body[data-d="2"]{--bg:#0a0a0a;--fg:#f3ead2;--muted:#a89f84;--line:#2e2814;--accent:#e6c65c;--btn-bg:#c9a227;--btn-fg:#130f00;--card:#15130e;--radius:14px;--fd:"Playfair Display",Georgia,serif;--fb:"DM Sans",system-ui,sans-serif;--wa-bg:#1fa855;--wa-fg:#fff;}
.d2-top{position:sticky;top:var(--sw);z-index:30;background:rgba(10,10,10,.95);border-bottom:1px solid var(--line);}
.d2-top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.d2-top img{width:50px;height:50px;border-radius:50%;}
.d2-top b{font-family:var(--fd);letter-spacing:2px;color:var(--accent);font-size:clamp(19px,5.6vw,26px);font-weight:700;flex:1;white-space:nowrap;}
.d2-top button{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:7px 12px;display:flex;gap:6px;align-items:center;cursor:pointer;}
.d2-hero{text-align:center;padding:40px 20px 56px;background:radial-gradient(120% 90% at 50% 0%,#2b2306,#0a0a0a 65%);border-bottom:1px solid var(--line);}
.d2-hero img{width:min(210px,58vw);height:min(210px,58vw);border-radius:50%;filter:drop-shadow(0 0 26px rgba(201,162,39,.4));}
.d2-hero h1{font-family:var(--fd);font-size:clamp(30px,8vw,52px);letter-spacing:5px;margin:20px 0 6px;background:linear-gradient(180deg,#f6e08a,#c9a227 70%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.d2-hero p{font-family:var(--fd);font-style:italic;font-size:19px;margin:0 0 20px;color:#f3e7c4;}
.d2-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.d2-cta a{border:1px solid var(--accent);color:var(--accent);padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;cursor:pointer;}
.d2-cta a.g{background:linear-gradient(180deg,#f2d97a,#c9a227);color:#130f00;}
.d2-feat{padding:26px 0 4px;}
.d2-feat h3{margin:0 16px 12px;font-family:var(--fd);color:var(--accent);font-size:19px;font-weight:600;}
.d2-fs{scroll-padding-left:16px;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 10px;scrollbar-width:none;}
.d2-fc{flex:none;width:70%;max-width:290px;scroll-snap-align:start;position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;}
.d2-fc img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;}
.d2-fc div{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.9));}
.d2-fc b{font-family:var(--fd);display:block;font-size:17px;font-weight:600;}
.d2-fc span{color:var(--accent);font-weight:700;}
.d2-chips{display:flex;gap:8px;overflow-x:auto;padding:16px;scrollbar-width:none;max-width:1040px;margin:0 auto;}
.d2-chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;}
.d2-chips button.on{background:var(--accent);color:#130f00;border-color:var(--accent);}
.d2-search{max-width:1040px;margin:0 auto;padding:16px 16px 0;}
.d2-search input{width:100%;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:400 16px var(--fb);outline:none;}
.d2-grid{max-width:1040px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:760px){.d2-grid{grid-template-columns:repeat(4,1fr);gap:16px;}}
.d2-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
.d2-ph{position:relative;aspect-ratio:4/5;cursor:pointer;background:#1c1810;display:flex;align-items:center;justify-content:center;}
.d2-ph img{width:100%;height:100%;object-fit:cover;}
.d2 .tag,.d2-ph .tag{background:#0a0a0a;color:var(--accent);border:1px solid var(--accent);border-radius:999px;}
.d2-b{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1;}
.d2-b small{font-size:10.5px;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;font-weight:700;}
.d2-b h3{margin:0;font-family:var(--fd);font-size:16px;font-weight:600;cursor:pointer;line-height:1.25;}
.d2-p{margin-top:auto;font-weight:800;color:var(--accent);font-size:16px;}
.d2-b .btn{padding:10px;font-size:14px;margin-top:6px;}
.d2-how{max-width:1040px;margin:44px auto 0;padding:0 16px;}
.d2-how h2{font-family:var(--fd);color:var(--accent);font-size:24px;margin:0 0 14px;}
.d2-how ol{display:grid;gap:10px;}
@media(min-width:700px){.d2-how ol{grid-template-columns:repeat(3,1fr);}}
.d2-how li{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);display:flex;gap:14px;}
.d2-how li::before{content:counter(st);flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#130f00;font:700 16px var(--fd);display:flex;align-items:center;justify-content:center;}
.d2-ft{background:#050505;border-top:1px solid var(--accent);margin-top:40px;}
.d2-ft .ft-t{color:var(--accent);}

/* ===== 3 · MAGAZINE (papier, encre, bordeaux) ===== */
body[data-d="3"]{--bg:#fbfaf7;--fg:#141414;--muted:#6c6a64;--line:#141414;--accent:#7a1f35;--btn-bg:#141414;--btn-fg:#fbfaf7;--card:#fbfaf7;--radius:0px;--fd:"Bodoni Moda",Georgia,serif;--fb:"DM Sans",system-ui,sans-serif;--wa-bg:#7a1f35;--wa-fg:#fff;}
.d3-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--fg);font-size:11px;letter-spacing:3px;text-transform:uppercase;position:sticky;top:var(--sw);background:var(--bg);z-index:30;}
.d3-top button{background:none;border:0;display:flex;gap:6px;align-items:center;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;}
.d3-mast{padding:36px 16px 20px;text-align:center;border-bottom:4px double var(--fg);margin:0 16px;}
.d3-mast h1{font-family:var(--fd);font-weight:700;font-size:clamp(46px,15vw,120px);line-height:.9;margin:0;letter-spacing:-1px;font-style:italic;}
.d3-mast p{margin:14px 0 0;font-size:12px;letter-spacing:4px;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.d3-lead{max-width:640px;margin:34px auto 10px;padding:0 20px;font-family:var(--fd);font-size:clamp(20px,4.6vw,28px);line-height:1.35;text-align:center;}
.d3-lead::first-letter{color:var(--accent);}
.d3-sum{max-width:520px;margin:30px auto;padding:0 20px;}
.d3-sum h4{margin:0 0 8px;font-size:11px;letter-spacing:3px;text-transform:uppercase;border-bottom:1px solid var(--fg);padding-bottom:8px;}
.d3-sum button{display:flex;width:100%;align-items:baseline;gap:8px;background:none;border:0;padding:8px 0;font:italic 500 22px var(--fd);cursor:pointer;text-align:left;}
.d3-sum button i{flex:1;border-bottom:1px dotted var(--fg);transform:translateY(-4px);}
.d3-sum button em{font:500 14px var(--fb);font-style:normal;color:var(--accent);}
.d3-sum button.on{color:var(--accent);}
.d3-sec{max-width:1040px;margin:50px auto 0;padding:0 16px;}
.d3-sec h2{font-family:var(--fd);font-weight:500;font-style:italic;font-size:clamp(34px,9vw,64px);margin:0 0 6px;line-height:1;border-top:1px solid var(--fg);padding-top:14px;}
.d3-item{display:grid;gap:14px;margin:26px 0 44px;}
@media(min-width:760px){.d3-item{grid-template-columns:1fr 1fr;gap:34px;align-items:center;}.d3-item:nth-child(even) .d3-pic{order:2;}}

function cartT(){return S.cart.reduce(function(a,l){var p=byId(l.id);return a+(p?p.prix*l.q:0);},0);}
function saveCart(){try{localStorage.setItem('da_cart3',JSON.stringify(S.cart));}catch(e){}}
function loadCart(){try{var c=JSON.parse(localStorage.getItem('da_cart3')||'[]');S.cart=c.filter(function(l){var p=byId(l.id);return p&&p.dispo&&l.q>0;});}catch(e){S.cart=[];}}
var _tt;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('show');},1500);}
function addLine(id,ch,q){var k=lineKey(id,ch),l=S.cart.find(function(x){return x.k===k;});if(l)l.q+=q;else S.cart.push({k:k,id:id,ch:ch||{},q:q});saveCart();afterCart();toast('Ajouté au panier ✓');}
function chgLine(k,d){var l=S.cart.find(function(x){return x.k===k;});if(!l)return;l.q+=d;if(l.q<=0)S.cart=S.cart.filter(function(x){return x.k!==k;});saveCart();afterCart();}
function quick(id){var p=byId(id);if(!p||!p.dispo)return;if(hasVar(p))openDetail(id);else addLine(id,{},1);}
function afterCart(){
  syncCards();
  var n=cartN();
  document.querySelectorAll('[data-cartn]').forEach(function(e){e.textContent=n;e.classList.toggle('hide',!n);});
  $('bar').classList.toggle('show',n>0);document.body.classList.toggle('hasbar',n>0);
  $('barN').textContent=n+' article'+(n>1?'s':'');$('barT').textContent=fmt(cartT());
  if($('cartSheet').classList.contains('show')&&!S.order)drawCart();
}
function syncCards(){
  document.querySelectorAll('[data-quick]').forEach(function(b){
    var n=countOf(b.getAttribute('data-quick')),m=b.getAttribute('data-mode');
    if(m==='icon'){b.innerHTML=n?String(n):svg('plus',16);}
    else{b.textContent=n?(b.getAttribute('data-label2')||'Ajouté')+' ('+n+')':b.getAttribute('data-label');}
    b.classList.toggle('on',!!n);
  });
}
/* ---- éléments communs ---- */
function imgTag(p){return p.photo?'<img src="'+p.photo+'" alt="'+esc(p.nom)+'" loading="lazy">':'<span class="noimg">&#10022;</span>';}
function priceH(p){return (p.prixBarre?'<s class="old">'+fmt(p.prixBarre)+'</s>':'')+'<span class="now">'+fmt(p.prix)+'</span>';}
function tagH(p){if(!p.dispo)return '<span class="tag out">Épuisé</span>';if(p.badge)return '<span class="tag">'+esc(p.badge)+'</span>';if(p.reste)return '<span class="tag">Plus que '+p.reste+'</span>';if(p.prixBarre)return '<span class="tag">Promo</span>';return '';}
function qb(p,mode,label,cls,label2){if(!p.dispo)return '<span class="soldout">Momentanément épuisé</span>';return '<button class="'+(cls||'btn')+'" data-quick="'+esc(p.id)+'" data-mode="'+mode+'" data-label="'+esc(label||'Ajouter')+'" data-label2="'+esc(label2||'Ajouté')+'" aria-label="Ajouter '+esc(p.nom)+'">'+(mode==='icon'?svg('plus',16):esc(label||'Ajouter'))+'</button>';}
function cats(){var s={},o=[];DATA.produits.forEach(function(p){var c=(p.categorie||'').trim();if(c&&!s[c.toLowerCase()]){s[c.toLowerCase()]=1;o.push(c);}});return o;}
function filtered(){var q=S.q.trim().toLowerCase();return DATA.produits.filter(function(p){if(S.cat!=='Tous'&&(p.categorie||'').trim().toLowerCase()!==S.cat.toLowerCase())return false;return !q||p.nom.toLowerCase().indexOf(q)>=0||(p.description||'').toLowerCase().indexOf(q)>=0||(p.categorie||'').toLowerCase().indexOf(q)>=0;}).sort(function(a,b){if(a.dispo!==b.dispo)return (b.dispo?1:0)-(a.dispo?1:0);return S.sort==='asc'?a.prix-b.prix:S.sort==='desc'?b.prix-a.prix:0;});}
function chipBtns(){return ['Tous'].concat(cats()).map(function(c){return '<button class="'+(c===S.cat?'on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';}).join('');}
function cartBtn(cls){return '<button class="'+(cls||'')+'" data-opencart aria-label="Panier">'+svg('bag',20)+'<i class="cn hide" data-cartn>0</i></button>';}
function waBtnTop(cls){return '<a class="'+(cls||'')+'" data-wa target="_blank" rel="noopener">WhatsApp</a>';}
function ftH(cls){return '<footer class="ft '+cls+'"><div class="ft-t">DALLAS AVENUE</div><div class="ft-s">Beauté, Confiance et Attitude</div><p>'+svg('pin',16)+' Nioro du Sahel, Koulouba</p><p>Tél / WhatsApp : 71 74 74 15</p><p>TikTok : Dallas Avenue</p><p class="ft-n">Horaires et livraison : confirmés sur WhatsApp à la commande.</p></footer>';}
function howH(cls,title){return '<section class="how '+cls+'"><h2>'+(title||'Comment commander')+'</h2><ol><li><div><b>Choisissez</b><span>Ajoutez vos produits au panier.</span></div></li><li><div><b>Envoyez</b><span>Votre commande s\'écrit toute seule dans WhatsApp.</span></div></li><li><div><b>Confirmation</b><span>On vous répond, on confirme le total, la livraison ou le retrait, puis le paiement.</span></div></li></ol></section>';}

}
/* ===== fiche produit ===== */
function openDetail(id){var p=byId(id);if(!p)return;S.did=id;S.dq=1;try{$('detailPanel').scrollTop=0;}catch(e){}S.sel={};(p.variantes||[]).forEach(function(v){if(v.valeurs.length===1)S.sel[v.label]=v.valeurs[0];});drawDetail();$('detail').classList.add('show');}
function missing(p){return (p.variantes||[]).filter(function(v){return !S.sel[v.label];}).map(function(v){return v.label.toLowerCase();});}
function drawDetail(){
  var p=byId(S.did);if(!p)return;
  var vars=(p.variantes||[]).map(function(v){return '<div class="vg"><div class="vl">'+esc(v.label)+(S.sel[v.label]?' : '+esc(S.sel[v.label]):'')+'</div><div class="vo">'+v.valeurs.map(function(x){return '<button data-var="'+esc(v.label)+'" data-val="'+esc(x)+'" class="'+(S.sel[v.label]===x?'on':'')+'">'+esc(x)+'</button>';}).join('')+'</div></div>';}).join('');
  var m=missing(p);
  var act=p.dispo?(vars+'<div class="qty" style="margin:14px 0"><button data-dq="-1">&minus;</button><span>'+S.dq+'</span><button data-dq="1">+</button></div><button class="btn" style="width:100%;padding:15px;font-size:16px" data-adddetail '+(m.length?'disabled':'')+'>'+(m.length?'Choisissez : '+m.join(', '):'Ajouter au panier · '+fmt(p.prix*S.dq))+'</button>'):'<div class="soldout" style="margin:12px 0">Momentanément épuisé</div><a class="btn" style="width:100%" target="_blank" rel="noopener" href="'+waLink('Bonjour Dallas Avenue, quand "'+p.nom+'" sera-t-il de nouveau disponible ?')+'">Demander la disponibilité</a>';
  $('detailPanel').innerHTML='<button class="x" data-close="detail" aria-label="Fermer">&times;</button><div class="dph">'+imgTag(p)+tagH(p)+'</div>'+(p.categorie?'<div class="dcat">'+esc(p.categorie)+'</div>':'')+'<h2 style="margin:4px 0 0">'+esc(p.nom)+'</h2><div class="dprice">'+priceH(p)+(p.reste&&p.dispo?' <small style="color:var(--danger);font-size:13px;margin-left:8px">Plus que '+p.reste+'</small>':'')+'</div>'+(p.description?'<p class="ddesc">'+esc(p.description)+'</p>':'')+act+'<button data-share style="margin-top:14px;background:none;border:0;display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer;font-size:14px">'+svg('share',16)+' Partager ce produit</button>'+similar(p);
}
function similar(p){var o=DATA.produits.filter(function(x){return x.id!==p.id&&x.dispo&&(x.categorie||'')===(p.categorie||'');}).slice(0,6);if(!o.length)return '';return '<div class="sim"><h4>Vous aimerez aussi</h4><div class="r">'+o.map(function(x){return '<div class="c" data-open="'+esc(x.id)+'"><i>'+(x.photo?'<img src="'+x.photo+'" alt="">':'')+'</i>'+esc(x.nom)+'<br><b>'+fmt(x.prix)+'</b></div>';}).join('')+'</div></div>';}
function shareProduct(){
  var p=byId(S.did);if(!p)return;var url=location.href.split('#')[0]+'#p-'+p.id;
  try{if(navigator.share){navigator.share({title:p.nom,url:url}).catch(function(){});return;}}catch(e){}
  try{navigator.clipboard.writeText(url).then(function(){toast('Lien copié');},function(){toast(url);});}catch(e){toast(url);}
}
/* ===== panier ===== */
function drawCart(){
  var P=$('cartPanel');
  if(S.order){P.innerHTML='<button class="x" data-close="cartSheet" aria-label="Fermer">&times;</button><div class="okbox"><div class="big">'+svg('check',30)+'</div><h2>Commande prête</h2><div class="num">'+esc(S.order.num)+'</div><p style="color:var(--muted)">WhatsApp s\'ouvre avec votre commande. Appuyez sur « Envoyer » pour la transmettre.</p><a class="btn wa" target="_blank" rel="noopener" href="'+S.order.url+'">Ouvrir WhatsApp</a><button class="btn" style="width:100%;margin-top:10px;background:transparent;color:var(--fg);border:1px solid var(--line)" data-finish>Terminer et vider le panier</button></div>';return;}
  var lines=S.cart.map(function(l){var p=byId(l.id);if(!p)return '';var ch=Object.keys(l.ch).map(function(k){return l.ch[k];}).join(' · ');return '<div class="line"><div>'+esc(p.nom)+'<small>'+(ch?esc(ch)+' · ':'')+fmt(p.prix)+' × '+l.q+'</small></div><div style="text-align:right"><b>'+fmt(p.prix*l.q)+'</b><div class="qty" style="margin-top:6px;justify-content:flex-end"><button data-ql="'+esc(l.k)+'" data-d="-1">&minus;</button><span>'+l.q+'</span><button data-ql="'+esc(l.k)+'" data-d="1">+</button></div></div></div>';}).join('');
  var f=S.form;
  P.innerHTML='<button class="x" data-close="cartSheet" aria-label="Fermer">&times;</button><h2>Ma commande</h2>'+(lines||'<p style="color:var(--muted)">Votre panier est vide.</p>')+'<div class="tot"><span>Total</span><span>'+fmt(cartT())+'</span></div>'+
   '<label for="fNom">Votre nom</label><input type="text" id="fNom" autocomplete="name" value="'+esc(f.nom)+'" placeholder="Nom et prénom">'+
   '<label for="fTel">Votre téléphone</label><input type="tel" id="fTel" autocomplete="tel" value="'+esc(f.tel)+'" placeholder="Ex : 70 00 00 00">'+
   '<label for="fMode">Retrait ou livraison</label><select id="fMode"><option'+(f.mode==="Retrait à l'institut"?' selected':'')+'>Retrait à l\'institut</option><option'+(f.mode==='Livraison'?' selected':'')+'>Livraison</option></select>'+
   '<label for="fAdr">Quartier / adresse (si livraison)</label><input type="text" id="fAdr" value="'+esc(f.adr)+'" placeholder="Quartier, repère...">'+
   '<label for="fNote">Précisions (optionnel)</label><textarea id="fNote" rows="2">'+esc(f.note)+'</textarea><div class="err" id="ferr" hidden></div><div style="height:14px"></div>'+
   '<button class="btn wa" data-send '+(S.cart.length?'':'disabled')+'>Commander sur WhatsApp</button><p style="font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0">Le paiement se fait à la confirmation de la commande.</p>';
}
function readForm(){var g=function(i){var e=$(i);return e?e.value:'';};S.form={nom:g('fNom'),tel:g('fTel'),mode:g('fMode')||S.form.mode,adr:g('fAdr'),note:g('fNote')};}
function sendOrder(){
  readForm();var f=S.form,err=$('ferr');
  var bad=!f.nom.trim()?'Merci d\'indiquer votre nom.':!f.tel.trim()?'Merci d\'indiquer votre numéro de téléphone.':(f.mode==='Livraison'&&!f.adr.trim())?'Merci d\'indiquer votre quartier pour la livraison.':'';
  if(bad){err.textContent=bad;err.hidden=false;return;}
  var d=new Date(),num='DA-'+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'-'+Math.floor(1000+Math.random()*9000);
  var m='*Nouvelle commande Dallas Avenue*\nN° '+num+'\n\n';
  S.cart.forEach(function(l){var p=byId(l.id);if(!p)return;var ch=Object.keys(l.ch).map(function(k){return k+' '+l.ch[k];}).join(', ');m+='- '+p.nom+(ch?' ('+ch+')':'')+' x'+l.q+' = '+fmt(p.prix*l.q)+'\n';});
  m+='\n*TOTAL : '+fmt(cartT())+'*\n\nNom : '+f.nom+'\nTél : '+f.tel+'\n'+f.mode+(f.adr?' : '+f.adr:'')+'\n'+(f.note?'Précisions : '+f.note+'\n':'');
  S.order={num:num,url:waLink(m),msg:m};drawCart();
  var a=document.createElement('a');a.href=S.order.url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();document.body.removeChild(a);
}
/* ===== événements ===== */
document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-design]'))){S.d=+t.getAttribute('data-design');S.cat='Tous';S.q='';draw();drawSw();window.scrollTo(0,0);return;}
  if((t=e.target.closest('[data-cat]'))){S.cat=t.getAttribute('data-cat');update();return;}
  if((t=e.target.closest('[data-quick]'))){e.stopPropagation();quick(t.getAttribute('data-quick'));return;}
  if((t=e.target.closest('[data-open]'))){openDetail(t.getAttribute('data-open'));return;}
  if((t=e.target.closest('[data-scroll]'))){var el=$(t.getAttribute('data-scroll'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(e.target.closest('[data-opencart]')){S.order=null;drawCart();$('cartSheet').classList.add('show');return;}
  if((t=e.target.closest('[data-close]'))){$(t.getAttribute('data-close')).classList.remove('show');return;}
  if(e.target.id==='detail'||e.target.id==='cartSheet'){e.target.classList.remove('show');return;}
  if((t=e.target.closest('[data-var]'))){S.sel[t.getAttribute('data-var')]=t.getAttribute('data-val');drawDetail();return;}
  if((t=e.target.closest('[data-dq]'))){S.dq=Math.max(1,S.dq+(+t.getAttribute('data-dq')));drawDetail();return;}
  if(e.target.closest('[data-adddetail]')){var p=byId(S.did);if(p&&!missing(p).length){addLine(p.id,Object.assign({},S.sel),S.dq);$('detail').classList.remove('show');}return;}
  if(e.target.closest('[data-share]')){shareProduct();return;}
  if((t=e.target.closest('[data-ql]'))){readForm();chgLine(t.getAttribute('data-ql'),+t.getAttribute('data-d'));drawCart();return;}
  if(e.target.closest('[data-send]')){sendOrder();return;}
  if(e.target.closest('[data-finish]')){S.cart=[];S.order=null;saveCart();afterCart();$('cartSheet').classList.remove('show');toast('Merci pour votre commande');return;}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;update();}});
document.addEventListener('change',function(e){if(e.target.id==='sort'){S.sort=e.target.value;update();}});
function boot(){
  loadCart();var h=(location.hash||'').replace('#','');
  drawSw();draw();
  if(/^p-/.test(h)){var id=h.slice(2);if(byId(id))openDetail(id);}
}
(function(){
  if(!CFG.live){boot();return;}
  document.getElementById('app').innerHTML='<div class="skel"></div><div class="skel"></div>';
  fetch('boutique.json?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){
    DATA=d;WA=d.whatsapp||WA;boot();
  }).catch(function(){document.getElementById('app').innerHTML='<div style="padding:60px 24px;text-align:center"><h2 style="font-family:var(--fd);color:var(--accent)">DALLAS AVENUE</h2><p>La boutique se charge mal. Vérifiez votre connexion et réessayez.</p><a class="btn" style="text-decoration:none" href="https://wa.me/22371747415">Nous écrire sur WhatsApp</a></div>';});
})();
</script>
