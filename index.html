<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dallas Avenue - Gestion</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Dallas Avenue">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --gold:#c9a227;
    --gold-light:#f3e7c4;
    --black:#111111;
    --bg:#f7f5f0;
    --card:#ffffff;
    --border:#e3ddc9;
    --text:#1c1c1a;
    --muted:#7a766a;
    --danger:#a3352f;
    --green:#2f7d4f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:76px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}
  header.topbar{
    background:var(--black);
    color:var(--gold);
    padding:10px 14px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.topbar img{width:68px;height:68px;border-radius:50%;flex:none;}
  header.topbar .titles{line-height:1.2;min-width:0;}
  header.topbar .titles .t1{font-weight:800;font-size:clamp(20px,6.2vw,26px);letter-spacing:.06em;white-space:nowrap;}
  header.topbar .titles .t2{font-size:11px;color:#d8c98a;}
  h2.section-title{font-size:16px;margin:16px 0 10px;color:var(--black);}
  h3.sub-title{font-size:13px;margin:14px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .row + .row{margin-top:4px;}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;}
  input,select,textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    background:#fff;
    color:var(--text);
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .btn{
    display:inline-block;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--black);
    background:var(--black);
    color:var(--gold);
    font-size:14px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .btn.secondary{background:#fff;color:var(--black);border-color:var(--border);}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger);}
  .btn.block{width:100%;margin-top:10px;}
  .btn.small{padding:5px 9px;font-size:12px;}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--gold-light);color:#5c4a10;font-size:11px;font-weight:600;}
  .pill.alert{background:#fbe0de;color:#8a241c;}
  .item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .item .name{font-size:14px;font-weight:500;}
  .item .meta{font-size:12px;color:var(--muted);}
  .meta{font-size:12px;color:var(--muted);}
  .item .price{font-size:14px;font-weight:600;white-space:nowrap;}
  .cat-header{font-size:12px;font-weight:700;color:#8a6d0e;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
  .metric .lbl{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .metric .val{font-size:19px;font-weight:700;}
  table.mini{width:100%;border-collapse:collapse;font-size:12px;}
  table.mini th{text-align:left;color:var(--muted);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--border);font-size:11px;}
  table.mini td{padding:6px 4px;border-bottom:1px solid var(--border);}
  table.mini tr:last-child td{border-bottom:none;}
  .empty{color:var(--muted);font-size:13px;padding:14px 0;text-align:center;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;}
  .icon-btn.danger{color:var(--danger);}
  nav.bottomnav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--black);
    display:flex;
    z-index:30;
    box-shadow:0 -2px 8px rgba(0,0,0,.15);
  }
  nav.bottomnav button{
    flex:1;background:none;border:none;color:#a99a5e;padding:9px 1px 8px;
    font-size:10px;font-family:inherit;cursor:pointer;
  }
  nav.bottomnav button .ic{display:block;font-size:17px;margin-bottom:2px;}
  @media(max-width:480px){nav.bottomnav button{font-size:9.5px;} nav.bottomnav button .ic{font-size:15px;}}
  nav.bottomnav button.active{color:var(--gold);}
  .plusmenu{position:fixed;bottom:64px;right:12px;display:flex;flex-direction:column;min-width:180px;background:var(--card,#fff);color:var(--text,#222);border:1px solid #ccc;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:60;overflow:hidden;}
  .plusmenu[hidden]{display:none;}
  .plusmenu button{padding:14px 16px;background:none;border:0;border-bottom:1px solid #ddd;text-align:left;font-size:15px;color:inherit;}
  .plusmenu button:last-child{border-bottom:0;}
  .subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
  .subtabs button{flex:1 0 auto;padding:9px 10px;white-space:nowrap;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .subtabs button.active{background:var(--black);color:var(--gold);border-color:var(--black);}
  .view{display:none;}
  .view.active{display:block;padding-top:12px;}
  .facline{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:var(--black);color:#fff;padding:9px 16px;border-radius:20px;
    font-size:13px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .banner-note{font-size:11px;color:var(--muted);background:var(--gold-light);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .facture-summary{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;}

  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;}
  .chips button{flex:none;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
  .chips button.on{background:var(--black);color:var(--gold);border-color:var(--black);}
  details.pd summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px;}
  .qs{display:flex;gap:6px;align-items:center;margin-top:8px;}
  .qs input{flex:1;min-width:0;}
  .tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .tile .t1{font-weight:600;font-size:14px;}
  .tile .t2{font-size:12px;color:var(--muted);}
  .bar{height:8px;border-radius:4px;background:var(--gold-light);overflow:hidden;margin-top:4px;}
  .bar i{display:block;height:100%;background:var(--gold);}

  .lockscr{position:fixed;inset:0;background:#0a0a0a;z-index:200;color:#f3e7c4;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;padding:20px;text-align:center;}
  .lockscr img{width:96px;height:96px;border-radius:50%;margin-bottom:10px;}
  .lockscr h1{margin:4px 0 2px;color:var(--gold);font-size:22px;letter-spacing:.08em;}
  .lockscr .sub{font-size:13px;opacity:.75;margin-bottom:14px;}
  .lockscr .dots{height:30px;font-size:26px;letter-spacing:8px;color:var(--gold);}
  .lockscr .lockusers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px;max-width:420px;}
  .lockscr .lockuser{border:1px solid #3a3320;background:#17140c;color:#f3e7c4;border-radius:12px;padding:8px 12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:110px;}
  .lockscr .lockuser small{font-size:11px;font-weight:400;opacity:.7;margin-top:2px;}
  .lockscr .lockuser.on{border-color:#c9a227;background:#2a2410;color:#e6c65c;}
  .lockscr .lockinput{width:240px;max-width:80vw;text-align:center;font-size:28px;letter-spacing:10px;background:#17140c;border:1px solid #3a3320;color:#f3e7c4;border-radius:14px;padding:12px;margin:6px 0 10px;font-family:inherit;}
  .lockscr .msg{height:20px;font-size:13px;color:#ff8a80;margin-bottom:6px;}
  .lockscr .pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px;}
  .lockscr .pad button{height:60px;border-radius:50%;border:1px solid #3a3320;background:#17140c;color:#f3e7c4;font-size:22px;font-family:inherit;cursor:pointer;}
  .lockscr .pad button:active{background:#2a2410;}
  .lockscr .pad .ok{background:var(--gold);color:#111;font-weight:700;font-size:16px;}
  .lockbtn{margin-left:auto;flex:none;font-size:18px !important;padding:8px 11px !important;background:#1c1810;border:1px solid #3a3320;color:var(--gold);border-radius:20px;padding:7px 11px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap;}
  body.locked .wrap, body.locked nav.bottomnav{visibility:hidden;}
  body.role-caisse nav.bottomnav button[data-tab="produits"],
  body.role-caisse nav.bottomnav button[data-tab="accueil"],
  body.role-caisse nav.bottomnav button[data-tab="finances"],
  body.role-caisse nav.bottomnav button[data-tab="sauvegarde"],
  body.role-caisse nav.bottomnav button[data-tab="plus"],
  body.role-caisse nav.bottomnav button[data-tab="clients"]{display:none;}
  body.role-caisse #view-soins .subtabs, body.role-caisse #view-produits .subtabs{display:none;}
  body.role-caisse .icon-btn.danger, body.role-caisse .btn.danger{display:none;}

  /* pavé numérique à l'écran */
  #numpad{position:fixed;left:0;right:0;bottom:0;z-index:300;background:#15130e;border-top:2px solid #c9a227;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));display:none;box-shadow:0 -8px 24px rgba(0,0,0,.35);}
  #numpad.show{display:block;}
  #numpad .np-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto;}
  #numpad button{height:56px;border-radius:12px;border:1px solid #3a3320;background:#221e12;color:#f3e7c4;font-size:22px;font-weight:600;font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
  #numpad button:active{background:#3a3320;}
  #numpad .np-ok{background:#c9a227;color:#111;font-weight:800;}
  #numpad .np-zero{grid-column:span 4;}
  #numpad .np-del{color:#ff8a80;}
  body.hasnumpad{padding-bottom:260px;}
  .pos{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;}
  .pos-gauche{min-width:0;}
  .pos-rech{margin-bottom:8px;}
  .pos-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;}
  .pos-chip{flex:none;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .pos-chip.on{background:var(--black);color:var(--gold);border-color:var(--black);}
  .pos-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
  .pos-tile{min-width:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);}
  .pos-tile:active{transform:scale(.97);}
  .pos-tile:disabled{opacity:.45;cursor:not-allowed;}
  .pos-img{width:100%;aspect-ratio:1/1;border-radius:8px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .pos-img img{width:100%;height:100%;object-fit:cover;}
  .pos-init{font-size:22px;font-weight:800;color:#8a6d0e;}
  .pos-nom{font-size:12px;font-weight:600;margin-top:6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .pos-prix{font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap;}
  .pos-stk{font-size:10px;color:var(--muted);}
  .pos-ticket{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .pos-ligne{padding:8px 0;border-bottom:1px solid var(--border);}
  .pos-ligne-nom{font-size:13px;font-weight:600;}
  .pos-ligne-bas{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .pos-qte{display:flex;align-items:center;gap:6px;}
  .pos-qte button{width:30px;height:30px;border-radius:50%;border:1px solid var(--black);background:#fff;font-size:16px;cursor:pointer;}
  .pos-qte span{min-width:26px;text-align:center;font-weight:700;}
  .pos-modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:4px;}
  .pos-mode{padding:9px 6px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;}
  .pos-mode.on{background:var(--gold);border-color:var(--gold);color:var(--black);}
  .code-admin{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;}
  .code-admin-carte{background:var(--card);color:var(--text);border-radius:12px;padding:18px;width:min(340px,100%);box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .pos-recu{margin:10px 0 4px;padding:10px;border:1px dashed var(--border);border-radius:10px;}
  .pos-billets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px;}
  .pos-billets button{padding:9px 4px;border-radius:8px;border:1px solid var(--black);background:#fff;color:var(--black);font-size:12px;font-weight:700;cursor:pointer;}
  .pos-rendu{font-size:17px;font-weight:700;color:var(--green);margin-top:8px;}
  .pos-manque{font-size:15px;font-weight:700;color:var(--danger);margin-top:8px;}
  .wrap:has(.pos){max-width:1180px;}
  @media(min-width:900px){
    .pos{grid-template-columns:minmax(0,1fr) 340px;}
    .pos-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
    .pos-ticket{position:sticky;top:12px;}
  }
</style>
</head>

</div></div>

async function cloudCreateBin(cfg){
  var res = await fetch('https://api.jsonbin.io/v3/b', {
    method:'POST',
    headers: { 'Content-Type':'application/json', 'X-Master-Key': cfg.apiKey, 'X-Bin-Name':'dallas_avenue_sync' },
    body: JSON.stringify(buildFullPayload())
  });
  if(!res.ok) throw new Error('create_failed');
  var json = await res.json();
  var id = json.metadata && json.metadata.id;
  if(!id) throw new Error('no_id');
  return id;
}
var SUPA_URL = 'https://yhblpurxywclgkskgqkz.supabase.co';
var SUPA_KEY = 'sb_publishable_bRNwMiAAHaUUfs7ftnOjxA_M0PjowoE';
function supaHeaders(extra){ return Object.assign({'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}, extra||{}); }
async function cloudPush(){
  var payload = buildFullPayload();
  var res = await fetch(SUPA_URL+'/rest/v1/donnees?on_conflict=cle', {
    method:'POST',
    headers: supaHeaders({'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'}),
    body: JSON.stringify([{ cle:'tout', valeur:payload, maj:new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('push_failed:'+res.status);
  lastKnownRemoteUpdatedAt = payload.updated_at;
}
async function cloudPull(){
  var res = await fetch(SUPA_URL+'/rest/v1/donnees?cle=eq.tout&select=valeur', { headers: supaHeaders() });
  if(!res.ok) throw new Error('pull_failed:'+res.status);
  var rows = await res.json();
  return (rows && rows[0] && rows[0].valeur) || null;
}
/* Hors ligne : chaque modification est marquée « en attente » et envoyée
   dès que la connexion revient (ou au prochain essai automatique). */
function marquerEnAttente(v){
  try{ localStorage.setItem('sync_pending', v ? '1' : '0'); }catch(e){}
}
function syncEnAttente(){
  try{ return localStorage.getItem('sync_pending') === '1'; }catch(e){ return false; }
}
function scheduleCloudPush(){
  var cfg = getSyncConfig();
  if(!cfg.enabled || !cfg.apiKey || !cfg.binId) return;
  marquerEnAttente(true);
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(envoyerEnAttente, 1500);
}
function envoyerEnAttente(){
  if(!syncEnAttente()) return;
  if(!navigator.onLine){ return; }
  cloudPush().then(function(){
    marquerEnAttente(false);
  }).catch(function(){
    clearTimeout(syncPushTimer);
    syncPushTimer = setTimeout(envoyerEnAttente, 30000);
  });
}
window.addEventListener('online', function(){
  showToast('Connexion retrouvée : synchronisation...');
  envoyerEnAttente();
});
window.addEventListener('offline', function(){
  showToast('Hors ligne : vos modifications seront envoyées au retour de la connexion');
});
async function setupSync(){
  var apiKey = nettoyerCle(document.getElementById('syncApiKey').value);
  var binId = nettoyerCle(document.getElementById('syncBinId').value);
  var enabled = document.getElementById('syncEnabled').checked;
  if(!apiKey){ showToast('Colle ta clé API JSONBin'); return; }
  var cfg = { apiKey:apiKey, binId:binId, enabled:enabled };
  showToast('Connexion en cours...');
  try{
    if(!cfg.binId){
      cfg.binId = await cloudCreateBin(cfg);
      saveSyncConfig(cfg);
      showToast('Espace de synchro créé : ' + cfg.binId);
    } else {
      saveSyncConfig(cfg);
      var remote = await cloudPull();
      if(remote){
        applyFullPayload(remote);
        lastKnownRemoteUpdatedAt = remote.updated_at;
      }
      showToast('Connecté - données récupérées depuis l\'autre appareil');
    }
    startSyncPolling();
    renderers.finances();
  }catch(e){
    showToast('Connexion impossible : ' + expliquerErreurSync(e));
  }
}
function expliquerErreurSync(e){
  var m = String((e && e.message) || e || '');
  if(/:(401|403)$/.test(m)) return 'Clé API refusée : vérifie la Master Key (copie-la entière)';
  if(/:404$/.test(m)) return 'ID de synchro introuvable : vérifie l\'identifiant';
  if(/:429$/.test(m)) return 'Trop de requêtes : réessaie dans une minute';
  if(/:(\d{3})$/.test(m)) return 'Erreur JSONBin ' + m.split(':').pop();
  if(e && e.name === 'TypeError') return 'Pas de connexion à JSONBin (réseau ou internet coupé)';
  return 'Erreur : ' + m;
}
async function syncMaintenant(){
  var cfg = getSyncConfig();
  if(!cfg.apiKey || !cfg.binId){ showToast('Configure d\'abord la synchronisation'); return; }
  showToast('Synchronisation...');
  try{
    if(syncEnAttente()){ await cloudPush(); marquerEnAttente(false); showToast('Synchronisé avec succès'); return; }
    var remote = await cloudPull();
    if(remote && remote.updated_at && remote.updated_at !== lastKnownRemoteUpdatedAt){
      applyFullPayload(remote);
      lastKnownRemoteUpdatedAt = remote.updated_at;
      renderCurrentView();
    }
    await cloudPush();
    showToast('Synchronisé avec succès');
  }catch(e){
    showToast('Synchronisation impossible : ' + expliquerErreurSync(e));
  }
}
function startSyncPolling(){
  clearInterval(syncPollTimer);
  var cfg = getSyncConfig();
  if(!cfg.enabled || !cfg.apiKey || !cfg.binId) return;
  syncPollTimer = setInterval(function(){
    if(syncEnAttente()){ envoyerEnAttente(); return; } // ne jamais écraser des modifications locales non envoyées
    cloudPull().then(function(remote){
      if(remote && remote.updated_at && remote.updated_at !== lastKnownRemoteUpdatedAt){
        applyFullPayload(remote);
        lastKnownRemoteUpdatedAt = remote.updated_at;
        renderCurrentView();
        showToast('Données mises à jour (autre appareil)');
      }
    }).catch(function(){});
  }, 20000);
}

function produitCalc(p){
  var coutTransport = p.prixAchat * p.pct;
  var achatTotal = p.prixAchat + coutTransport;
  var marge = p.prixVente - achatTotal;
  var margePct = achatTotal ? (marge/achatTotal) : 0;
  return { coutTransport:coutTransport, achatTotal:achatTotal, marge:marge, margePct:margePct };
}
function stockVendu(produitId){
  return DB.ventes.filter(function(v){return v.produitId===produitId;}).reduce(function(a,v){return a+v.qte;},0);
}
function stockPerdu(produitId){
  return (DB.pertes||[]).filter(function(x){return x.produitId===produitId;}).reduce(function(a,x){return a+x.qte;},0);
}
function stockRestant(p){
  return p.stock - stockVendu(p.id) - stockPerdu(p.id);
}

function envoyerPhotoSupabase(blob, nom){
  return fetch(SUPA_URL+'/storage/v1/object/photos/'+nom, {
    method:'POST',
    headers: supaHeaders({'Content-Type':'image/jpeg','x-upsert':'true'}),
    body: blob
  }).then(function(res){
    if(!res.ok) throw new Error('photo:'+res.status);
    return SUPA_URL+'/storage/v1/object/public/photos/'+nom;
  });
}
function handleProdPhoto(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      // Carré de fond blanc : la photo entière rentre dedans, centrée, sans être coupée
      var size = 640;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
      var k = Math.min(size/img.width, size/img.height);
      var dw = Math.round(img.width*k), dh = Math.round(img.height*k);
      ctx.drawImage(img, Math.round((size-dw)/2), Math.round((size-dh)/2), dw, dh);
      function afficher(src){
        prodPhotoTemp = src;
        var prev = document.getElementById('prodPhotoPreview');
        if(prev) prev.innerHTML = '<img src="'+src+'" style="width:100%;max-width:180px;border-radius:8px;margin-top:8px;display:block;">';
      }
      canvas.toBlob(function(blob){
        var nom = 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6) + '.jpg';
        envoyerPhotoSupabase(blob, nom).then(function(url){
          afficher(url);
          showToast('Photo envoyée en ligne');
        }).catch(function(){
          afficher(canvas.toDataURL('image/jpeg', 0.7));
          showToast('Photo non envoyée en ligne : gardée sur cet appareil');
        });
      }, 'image/jpeg', 0.7);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function saveProduit(){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  var nom = document.getElementById('prodNom').value.trim();
  var achat = parseFloat(document.getElementById('prodAchat').value);
  var pct = parseFloat(document.getElementById('prodPct').value);
  var vente = parseFloat(document.getElementById('prodVente').value);
  var stock = parseFloat(document.getElementById('prodStock').value);
  var seuilRaw = document.getElementById('prodSeuil').value;
  var seuil = seuilRaw==='' ? 5 : (parseFloat(seuilRaw)||0);
  if(!nom || isNaN(achat) || isNaN(pct) || isNaN(vente) || isNaN(stock)){ showToast('Remplis tous les champs'); return; }
  var categorie = document.getElementById('prodCat').value.trim();
  var description = document.getElementById('prodDesc').value.trim();
  var badge = document.getElementById('prodBadge').value;
  var tailles = document.getElementById('prodTailles').value.trim();
  var couleurs = document.getElementById('prodCouleurs').value.trim();
  var prixBarre = parseFloat(document.getElementById('prodPrixBarre').value) || 0;
  if(editingProduitId){
    var p = DB.produits.find(function(x){return x.id===editingProduitId;});
    p.nom=nom; p.prixAchat=achat; p.pct=pct/100; p.prixVente=vente; p.stock=stock; p.seuil=seuil;
    p.categorie=categorie; p.description=description; p.badge=badge; p.tailles=tailles; p.couleurs=couleurs; p.prixBarre=prixBarre;
    if(prodPhotoTemp) p.photo = prodPhotoTemp;
    editingProduitId = null;
  } else {
    DB.produits.push({ id:uid(), nom:nom, prixAchat:achat, pct:pct/100, prixVente:vente, stock:stock, seuil:seuil, categorie:categorie, description:description, badge:badge, tailles:tailles, couleurs:couleurs, prixBarre:prixBarre, photo:prodPhotoTemp||null });
  }
  prodPhotoTemp = null;
  saveKey(KEYS.produits, DB.produits);
  showToast('Catalogue mis à jour');
  renderers.produits();
}
function deleteProduit(id){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  DB.produits = DB.produits.filter(function(p){return p.id!==id;});
  saveKey(KEYS.produits, DB.produits);
  renderers.produits();
}

/* ===== pavé numérique à l'écran ===== */
var npTarget = null;
function npShow(inp){
  npTarget = inp;
  var pad = document.getElementById('numpad'); if(!pad) return;
  pad.classList.add('show'); document.body.classList.add('hasnumpad');
  inp.setAttribute('inputmode','none');
  setTimeout(function(){ try{ inp.scrollIntoView({block:'center'}); }catch(e){} }, 50);
}
function npHide(){
  var pad = document.getElementById('numpad'); if(pad) pad.classList.remove('show');
  document.body.classList.remove('hasnumpad');
  if(npTarget){ npTarget.dispatchEvent(new Event('change',{bubbles:true})); npTarget.blur(); }
  npTarget = null;
}
function npPress(k){
  var t = npTarget; if(!t) return;
  var v = String(t.value||'');
  if(k==='ok'){ npHide(); return; }
  if(k==='del'){ v = v.slice(0,-1); }
  else if(k==='.'){ if(v.indexOf('.')<0) v = (v===''?'0':v)+'.'; }
  else { if(v.length<12) v += k; }
  t.value = v;
  t.dispatchEvent(new Event('input',{bubbles:true}));
}
document.addEventListener('focusin', function(e){
  var t = e.target;
  if(t && t.tagName==='INPUT' && t.getAttribute('data-pad')==='1'){ npShow(t); }
});
document.addEventListener('pointerdown', function(e){
  var b = e.target.closest ? e.target.closest('#numpad button') : null;
  if(b){ e.preventDefault(); npPress(b.getAttribute('data-np')); return; }
  var inp = e.target.closest ? e.target.closest('input[data-pad="1"]') : null;
  if(inp){ npShow(inp); return; }
  if(npTarget && !(e.target.closest && e.target.closest('#numpad'))) npHide();
}, true);

  var sous = src.lignes.reduce(function(a,l){ return a+l.prix*l.qte; },0);
  var remise = Math.min(m.remise||0, sous);
  var total = sous - remise;
  var nb = src.lignes.reduce(function(a,l){ return a+l.qte; },0);
  var lignes = src.lignes.map(function(l,i){
    return '<div class="pos-ligne"><div class="pos-ligne-nom">'+escHtml(l.nom)+'<div class="meta">'+fmt(l.prix)+' / unité</div></div>' +
      '<div class="pos-ligne-bas"><div class="pos-qte"><button onclick="posQte(\''+kind+'\','+i+',-1)">&minus;</button>' +
      '<span>'+l.qte+'</span><button onclick="posQte(\''+kind+'\','+i+',1)">+</button></div>' +
      '<span class="price">'+fmt(l.prix*l.qte)+'</span></div></div>';
  }).join('') || '<div class="empty">Ticket vide. Touche un '+(kind==='soin'?'soin':'produit')+' pour l\'ajouter.</div>';
  var modes = MODES_PAIEMENT.map(function(md){
    return '<button class="pos-mode'+((m.paiement||'Espèces')===md?' on':'')+'" onclick="posPaiement(\''+kind+'\',\''+md+'\')">'+md+'</button>';
  }).join('');
  return '<div class="row" style="margin-bottom:4px;"><b>Ticket</b><span class="meta">'+nb+' article'+(nb>1?'s':'')+'</span></div>' +
    lignes +
    '<label>Client(e)</label><input type="text" id="posClient_'+kind+'" list="clientsDatalist" placeholder="Nom (optionnel)" value="'+escHtml(m.client||'')+'" oninput="posClient(\''+kind+'\',this.value)">' +
    '<label>Téléphone</label><input type="text" inputmode="none" data-pad="1" id="posTel_'+kind+'" value="'+escHtml(m.tel||'')+'" oninput="posTel(\''+kind+'\',this.value)">' +
    '<label>Remise (F)</label><input type="text" inputmode="none" data-pad="1" value="'+(m.remise||0)+'" onchange="posRemise(\''+kind+'\',this.value)">' +
    '<label>Mode de paiement</label><div class="pos-modes">'+modes+'</div>' +
    posRecuHtml(kind, total) +
    '<div class="row" style="margin:12px 0 4px;"><span>Sous-total</span><span>'+fmt(sous)+'</span></div>' +
    '<div class="row"><span style="font-weight:600;">À payer</span><b style="font-size:20px;">'+fmt(total)+'</b></div>' +
    '<button class="btn wa block" onclick="posValider(\''+kind+'\',\'wa\')">&#128172; Valider et envoyer sur WhatsApp</button>' +
    '<button class="btn block" style="margin-top:8px;" onclick="posValider(\''+kind+'\',\'normal\')">Valider et imprimer la facture</button>' +
    '<button class="btn secondary block" style="margin-top:8px;" onclick="posValider(\''+kind+'\',\'ticket\')">Valider et imprimer le ticket</button>' +
    '<button class="btn secondary block" style="margin-top:8px;" onclick="posValider(\''+kind+'\',null)">Valider sans imprimer</button>';
}
function posTotal(kind){
  var src = posSource(kind);
  var sous = src.lignes.reduce(function(a,l){ return a+l.prix*l.qte; },0);
  return sous - Math.min(src.meta.remise||0, sous);
}
function posRecuHtml(kind, total){
  var m = posSource(kind).meta;
  if((m.paiement||'Espèces')!=='Espèces') return '';
  var recu = m.recu||0, rendu = recu - total;
  var billets = [1000,5000,10000,20000].map(function(v){
    return '<button onclick="posRecuAjout(\''+kind+'\','+v+')">+ '+fmt(v)+'</button>';
  }).join('');
  var resultat = recu>0
    ? (rendu>=0 ? '<div class="pos-rendu">Monnaie à rendre : '+fmt(rendu)+'</div>'
                : '<div class="pos-manque">Reste à payer : '+fmt(-rendu)+'</div>')
    : '';
  return '<div class="pos-recu">' +
    '<div class="pos-billets">'+billets+
      '<button onclick="posRecuExact(\''+kind+'\')">Exact</button>'+
      '<button onclick="posRecuSet(\''+kind+'\',0)">Effacer</button></div>' +
    '<label>Montant reçu</label>' +
    '<input type="text" inputmode="none" data-pad="1" value="'+(recu||'')+'" placeholder="0" onchange="posRecuSet(\''+kind+'\',this.value)">' +
    resultat + '</div>';
}
function posRecuAjout(kind, v){ var m = posSource(kind).meta; m.recu = (m.recu||0) + v; posRefresh(kind); }
function posRecuSet(kind, v){ posSource(kind).meta.recu = parseFloat(String(v).replace(/\s/g,''))||0; posRefresh(kind); }
function posRecuExact(kind){ posSource(kind).meta.recu = posTotal(kind); posRefresh(kind); }

    '<button class="btn block" style="margin-top:8px;" onclick="imprimerFacture(\''+f.id+'\',\'normal\')">&#128424; Imprimer la facture</button>' +
    '<button class="btn secondary block" style="margin-top:8px;" onclick="imprimerFacture(\''+f.id+'\',\'ticket\')">&#128424; Imprimer le ticket</button>' +

function posRech(kind, v){
  POS[kind].rech = v;
  var g = document.getElementById('posGrille_'+kind); if(g) g.innerHTML = posGrilleHtml(kind);
}
function posCat(kind, c){ POS[kind].cat = c; posRefresh(kind); }
function posAdd(kind, id){
  var src = posSource(kind), it = src.items.find(function(x){return x.id===id;}); if(!it) return;
  if(kind==='produit'){
    var dejaDansTicket = src.lignes.filter(function(l){return l.id===id;}).reduce(function(a,l){return a+l.qte;},0);
    if(dejaDansTicket + 1 > stockRestant(it)){ showToast('Stock insuffisant : il reste '+stockRestant(it)+' '+it.nom); return; }
  }
  var l = src.lignes.find(function(x){return x.id===id;});
  if(l) l.qte += 1; else src.lignes.push({ id:it.id, nom:it.nom, prix:posPrix(kind,it), qte:1 });
  posRefresh(kind);
}
function posQte(kind, i, d){
  var src = posSource(kind), l = src.lignes[i]; if(!l) return;
  if(d>0 && kind==='produit'){
    var p = DB.produits.find(function(x){return x.id===l.id;});
    if(p && l.qte + 1 > stockRestant(p)){ showToast('Stock insuffisant : il reste '+stockRestant(p)+' '+p.nom); return; }
  }
  l.qte += d;
  if(l.qte<=0) src.lignes.splice(i,1);
  posRefresh(kind);
}
function posClient(kind, v){
  var m = posSource(kind).meta; m.client = v;
  var tel = lookupClientPhone(v);
  if(tel){ m.tel = tel; var t = document.getElementById('posTel_'+kind); if(t) t.value = tel; }
}
function posTel(kind, v){ posSource(kind).meta.tel = v; }
function posRemise(kind, v){ posSource(kind).meta.remise = parseFloat(v)||0; posRefresh(kind); }
function posPaiement(kind, mode){ posSource(kind).meta.paiement = mode; posRefresh(kind); }
function posFermer(kind){
  if(kind==='soin') derniereFactureSoinId = null; else derniereFactureId = null;
  posRefresh(kind);
}
function posValider(kind, mode){
  var src = posSource(kind);
  if(!src.lignes.length){ showToast('Le ticket est vide'); return; }
  if(kind==='produit'){
    for(var i=0;i<src.lignes.length;i++){
      var l = src.lignes[i], p = DB.produits.find(function(x){return x.id===l.id;});
      if(!p || l.qte > stockRestant(p)){ showToast('Stock insuffisant pour '+l.nom); return; }
    }
  }
  var sous = src.lignes.reduce(function(a,l){ return a+l.prix*l.qte; },0);
  var remise = Math.min(src.meta.remise||0, sous);
  var total = sous - remise;
  var paiement = src.meta.paiement || 'Espèces';
  if(paiement==='À crédit' && !(src.meta.client||'').trim()){ showToast('Indique le nom de la cliente pour une vente à crédit'); return; }
  if(paiement==='Espèces' && (src.meta.recu||0)>0 && src.meta.recu < total){ showToast('Montant reçu insuffisant : il manque '+fmt(total-src.meta.recu)); return; }

  var numero = consumeNumero(kind==='soin' ? 'factureSoin' : 'factureProduit');
  var facture = {
    id:uid(), type:(kind==='soin'?'soin':'produit'), numero:numero, date:todayISO(),
    client:(src.meta.client||'').trim(), tel:(src.meta.tel||'').trim(),
    lignes:src.lignes.map(function(l){ return { designation:l.nom, prix:l.prix, qte:l.qte, total:l.prix*l.qte, refId:l.id }; }),
    remise:remise, total:total, paiement:paiement, recu:(paiement==='Espèces' ? (src.meta.recu||0) : 0)
  };
  DB.factures.push(facture);
  saveKey(KEYS.factures, DB.factures);
  facturerVersVentes(facture, sous);
  if(paiement==='À crédit'){
    DB.dettes.push({ id:uid(), cliente:facture.client, tel:facture.tel||'', date:facture.date, montant:total, note:'Facture '+numero, paye:false });
    saveKey(KEYS.dettes, DB.dettes);
  }
  src.lignes.length = 0;
  src.meta.client = ''; src.meta.tel = ''; src.meta.remise = 0; src.meta.recu = 0; src.meta.paiement = 'Espèces';
  if(kind==='soin') derniereFactureSoinId = facture.id; else derniereFactureId = facture.id;
  showToast('Facture enregistrée ('+numero+')');
  posRefresh(kind);
  if(mode==='normal' || mode==='ticket') imprimerFacture(facture.id, mode);
  else if(mode==='wa') partagerFacture(facture.id);
}

/* ---- suppression de factures depuis la caisse (code administrateur) ---- */
function demanderCodeAdmin(message, onOk){
  var old = document.getElementById('codeAdminBox'); if(old) old.remove();
  var box = document.createElement('div');
  box.id = 'codeAdminBox'; box.className = 'code-admin';
  box.innerHTML = '<div class="code-admin-carte">' +
    '<div style="font-weight:700;margin-bottom:6px;">Code administrateur requis</div>' +
    '<div class="meta" style="margin-bottom:10px;">'+escHtml(message)+'</div>' +
    '<input type="password" inputmode="numeric" id="codeAdminInput" placeholder="Code" autocomplete="off">' +
    '<div class="row" style="margin-top:12px;gap:8px;">' +
      '<button class="btn secondary block" id="codeAdminAnnuler" style="margin-top:0;">Annuler</button>' +
      '<button class="btn block" id="codeAdminOk" style="margin-top:0;">Valider</button>' +
    '</div></div>';
  document.body.appendChild(box);
  var input = document.getElementById('codeAdminInput');
  input.focus();
  function fermer(){ box.remove(); }
  function valider(){
    var h = hashCode(input.value);
    var u = DB.utilisateurs.find(function(x){ return x.hash===h && x.role==='admin'; });
    if(!u){ showToast('Code administrateur incorrect'); input.value=''; input.focus(); return; }
    fermer(); onOk(u);
  }
  document.getElementById('codeAdminAnnuler').onclick = fermer;
  document.getElementById('codeAdminOk').onclick = valider;
  input.onkeydown = function(e){ if(e.key==='Enter') valider(); };
}
function posFacturesRecentes(kind){
  var liste = DB.factures.filter(function(f){ return (f.type==='soin') === (kind==='soin'); }).slice().reverse().slice(0,8);
  if(!liste.length) return '';
  return '<h3 class="sub-title">Dernières factures</h3>' + liste.map(function(f){
    return '<div class="item"><div>' +
      '<div class="name"><span class="meta">'+escHtml(f.numero)+'</span> '+escHtml(f.client||'Client de passage')+'</div>' +
      '<div class="meta">'+f.date+' · '+escHtml(f.paiement||'Espèces')+'</div></div>' +
      '<div class="row" style="gap:4px;"><span class="price">'+fmt(f.total)+'</span>' +
      '<button class="icon-btn" title="Envoyer sur WhatsApp" onclick="partagerFacture(\''+f.id+'\')">&#128172;</button>' +
      '<button class="icon-btn" title="Imprimer la facture" onclick="imprimerFacture(\''+f.id+'\',\'normal\')">&#128424;</button>' +
      '<button class="btn secondary small" onclick="posSupprimerFacture(\''+f.id+'\',\''+kind+'\')">Supprimer</button></div></div>';
  }).join('');
}
function posSupprimerFacture(id, kind){
  var f = DB.factures.find(function(x){ return x.id===id; }); if(!f) return;
  demanderCodeAdmin('Supprimer la facture '+f.numero+' ? Les ventes, le stock et la dette liés seront annulés.', function(){
    DB.ventes = DB.ventes.filter(function(v){ return v.facture!==f.numero; });
    DB.journal = DB.journal.filter(function(j){ return j.facture!==f.numero; });
    DB.dettes = DB.dettes.filter(function(d){ return d.note!=='Facture '+f.numero; });
    DB.factures = DB.factures.filter(function(x){ return x.id!==id; });
    saveKey(KEYS.ventes, DB.ventes); saveKey(KEYS.journal, DB.journal);
    saveKey(KEYS.dettes, DB.dettes); saveKey(KEYS.factures, DB.factures);
    if(derniereFactureId===id) derniereFactureId = null;
    if(derniereFactureSoinId===id) derniereFactureSoinId = null;
    showToast('Facture supprimée');
    posRefresh(kind);
  });
}

/* ---- partage WhatsApp des factures et ventes ---- */
function waTelUrl(tel, msg){
  var d = String(tel||'').replace(/\D/g,'');
  if(d.length===8) d = '223' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
}
function ouvrirWhatsApp(url){
  var a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}
function texteFacture(f){
  var m = '*Facture Dallas Avenue*\n';
  m += 'N° ' + f.numero + ' · ' + f.date + '\n\n';
  f.lignes.forEach(function(l){ m += '- ' + l.designation + ' x' + l.qte + ' = ' + fmt(l.total) + '\n'; });
  if(f.remise) m += 'Remise : -' + fmt(f.remise) + '\n';
  m += '\n*TOTAL : ' + fmt(f.total) + '*\n\nMerci de votre confiance !';
  return m;
}
function partagerVente(id){
  var v = DB.ventes.find(function(x){return x.id===id;});
  if(!v){ showToast('Vente introuvable'); return; }
  var m = '*Dallas Avenue*\n' + (v.numero||'') + ' · ' + v.date + '\n\n' +
    '- ' + v.produitNom + ' x' + v.qte + ' = ' + fmt(v.total) + '\n\n*TOTAL : ' + fmt(v.total) + '*\n\nMerci de votre confiance !';
  ouvrirWhatsApp(waTelUrl('', m));
}

function addVente(){
  var produitId = document.getElementById('venteProduit').value;
  var date = document.getElementById('venteDate').value || todayISO();
  var qte = parseFloat(document.getElementById('venteQte').value);
  var client = document.getElementById('venteClient').value.trim();
  if(!produitId){ showToast('Choisis un produit'); return; }
  if(!qte || qte<=0){ showToast('Indique une quantité valide'); return; }
  var p = DB.produits.find(function(x){return x.id===produitId;});
  var c = produitCalc(p);
  var numero = consumeNumero('vente');
  DB.ventes.push({
    id:uid(), numero:numero, date:date, produitId:produitId, produitNom:p.nom,
    prixVente:p.prixVente, coutUnitaire:c.achatTotal, margeUnitaire:c.marge,
    qte:qte, total:qte*p.prixVente, marge:qte*c.marge, client:client
  });
  saveKey(KEYS.ventes, DB.ventes);
  showToast('Vente enregistrée ('+numero+')');
  renderers.produits();
}
function deleteVente(id){
  DB.ventes = DB.ventes.filter(function(v){return v.id!==id;});
  saveKey(KEYS.ventes, DB.ventes);
  renderers.produits();
}
function setProduitsPeriode(v){ produitsPeriode = v; renderers.produits(); }

function addLigneFacture(){
  var idx = document.getElementById('facDesignation').value;
  var qte = parseFloat(document.getElementById('facQte').value);
  if(idx===''){ showToast('Choisis un élément'); return; }
  if(!qte || qte<=0){ showToast('Quantité invalide'); return; }
  var c = window.__facSource[parseInt(idx,10)];
  nouvelleFactureLignes.push({ designation:c.nom, prix:c.prix, qte:qte, total:c.prix*qte, refId:c.id });
  renderers.factures();
}
function removeLigneFacture(idx){
  nouvelleFactureLignes.splice(idx,1);
  renderers.factures();
}
function saveFacture(){
  if(!nouvelleFactureLignes.length){ showToast('Ajoute au moins une ligne'); return; }
  var numero = consumeNumero(facturesSub==='soin' ? 'factureSoin' : 'factureProduit');
  var date = document.getElementById('facDate').value || todayISO();
  var client = document.getElementById('facClient').value.trim();
  var tel = document.getElementById('facTel').value.trim();
  var remise = nouvelleFactureMeta.remise || 0;
  var sousTotal = nouvelleFactureLignes.reduce(function(a,l){return a+l.total;},0);
  var facture = { id:uid(), type:facturesSub, numero:numero, date:date, client:client, tel:tel, lignes:nouvelleFactureLignes, remise:remise, total:sousTotal-remise };
  DB.factures.push(facture);
  saveKey(KEYS.factures, DB.factures);
  if(facLie) facturerVersVentes(facture, sousTotal);
  nouvelleFactureLignes = [];
  nouvelleFactureMeta = { numero:null, date:null, client:'', tel:'', remise:0 };
  showToast('Facture enregistrée ('+numero+')');
  renderers.factures();
}
function facturerVersVentes(f, sousTotal){
  var ratio = sousTotal > 0 ? (sousTotal - (f.remise||0)) / sousTotal : 1;
  if(f.type==='soin'){
    f.lignes.forEach(function(l){
      var soin = DB.soins.find(function(x){return x.id===l.refId;});
      for(var k=0;k<l.qte;k++){
        DB.journal.push({ id:uid(), date:f.date, cliente:f.client, soinId:l.refId, soinNom:l.designation, prix:Math.round(l.prix*ratio), employe:'', facture:f.numero });
      }
    });
    saveKey(KEYS.journal, DB.journal);
  } else {
    f.lignes.forEach(function(l){
      var pr = DB.produits.find(function(x){return x.id===l.refId;}); if(!pr) return;
      var c = produitCalc(pr), total = Math.round(l.total*ratio), numero = consumeNumero('vente');
      DB.ventes.push({ id:uid(), numero:numero, date:f.date, produitId:pr.id, produitNom:pr.nom, prixVente:total/l.qte, coutUnitaire:c.achatTotal,
        margeUnitaire:total/l.qte - c.achatTotal, qte:l.qte, total:total, marge:total - l.qte*c.achatTotal, client:f.client, facture:f.numero });
    });
    saveKey(KEYS.ventes, DB.ventes);
  }
}
function deleteFacture(id){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  var fac = DB.factures.find(function(f){return f.id===id;});
  if(fac){
    var avant = DB.ventes.length + DB.journal.length;
    DB.ventes = DB.ventes.filter(function(v){return v.facture!==fac.numero;});
    DB.journal = DB.journal.filter(function(j){return j.facture!==fac.numero;});
    if(DB.ventes.length + DB.journal.length !== avant){ saveKey(KEYS.ventes, DB.ventes); saveKey(KEYS.journal, DB.journal); }
  }
  DB.factures = DB.factures.filter(function(f){return f.id!==id;});
  saveKey(KEYS.factures, DB.factures);
  renderers.factures();
}

function truncateText(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function formatDateFr(iso){
  if(!iso) return '';
  var p = iso.split('-');
  return p.length===3 ? (p[2]+'/'+p[1]+'/'+p[0]) : iso;
}
function loadImagePromise(src){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}
async function buildFactureCanvas(f){
  var W = 800;
  var lineH = 34;
  var headerH = 170;
  var metaH = 92;
  var tableHeaderH = 40;
  var linesH = Math.max(1, f.lignes.length) * lineH;
  var totalsH = f.remise ? 150 : 120;
  var footerH = 140;
  var H = headerH + metaH + tableHeaderH + linesH + totalsH + footerH;

  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#111111';
  ctx.fillRect(0,0,W,headerH);

  try{
    var logoImg = await loadImagePromise('data:image/jpeg;base64,'+LOGO_INVOICE_B64);
    var logoSize = 110;
    ctx.drawImage(logoImg, 30, (headerH-logoSize)/2, logoSize, logoSize);
  }catch(e){}

  var textX = 30+110+20;
  var padTop = 42;
  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('DALLAS AVENUE', textX, padTop);
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#d8c98a';
  ctx.fillText('Institut de beauté & vente de produits bien-être', textX, padTop+26);
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#a99a5e';
  ctx.fillText('Nioro du Sahel, Koulouba', textX, padTop+46);
  ctx.fillText('Tél : 71 74 74 15', textX, padTop+64);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#c9a227';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('FACTURE', W-30, headerH/2 - 10);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(f.numero, W-30, headerH/2 + 16);
  ctx.textAlign = 'left';

  var y = headerH + 38;
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 15px sans-serif';
  ctx.fillText('Date : ' + formatDateFr(f.date), 30, y);
  ctx.fillText('Client : ' + (f.client||'-'), 30, y+26);
  if(f.tel){ ctx.fillText('Téléphone : ' + f.tel, 30, y+52); }

  y = headerH + metaH;
  ctx.fillStyle = '#f3e7c4';
  ctx.fillRect(30, y, W-60, tableHeaderH);
  ctx.fillStyle = '#111111';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillText('DÉSIGNATION', 45, y+26);
  ctx.fillText('QTÉ', W-330, y+26);
  ctx.fillText('PRIX U.', W-235, y+26);
  ctx.fillText('TOTAL', W-115, y+26);
  y += tableHeaderH;

  ctx.font = '14px sans-serif';
  f.lignes.forEach(function(l, i){
    ctx.fillStyle = i%2===0 ? '#ffffff' : '#faf8f2';
    ctx.fillRect(30, y, W-60, lineH);
    ctx.fillStyle = '#111111';
    ctx.fillText(truncateText(l.designation, 32), 45, y+22);
    ctx.fillText(String(l.qte), W-330, y+22);
    ctx.fillText(fmt(l.prix), W-235, y+22);
    ctx.fillText(fmt(l.total), W-115, y+22);
    y += lineH;
  });

  y += 24;
  ctx.textAlign = 'right';
  ctx.font = '15px sans-serif';
  ctx.fillStyle = '#111111';
  ctx.fillText('Sous-total : ' + fmt(f.total+f.remise), W-30, y); y += 26;
  if(f.remise){ ctx.fillText('Remise : -' + fmt(f.remise), W-30, y); y += 26; }
  ctx.font = 'bold 24px sans-serif';
  ctx.fillText('TOTAL : ' + fmt(f.total), W-30, y); y += 44;
  ctx.textAlign = 'left';

  ctx.strokeStyle = '#e3ddc9';
  ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-30,y); ctx.stroke();
  y += 32;
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = '#8a6d0e';
  ctx.fillText('BEAUTÉ  •  CONFIANCE  •  ATTITUDE', W/2, y);
  y += 24;
  ctx.font = '12px sans-serif';
  ctx.fillStyle = '#7a766a';
  ctx.fillText('Tél : 71 74 74 15   •   TikTok : Dallas Avenue', W/2, y);
  y += 26;
  ctx.font = 'italic 13px sans-serif';
  ctx.fillText('Merci de votre confiance - Dallas Avenue', W/2, y);
  ctx.textAlign = 'left';

  return canvas;
}
async function partagerFacture(id){
  var f = DB.factures.find(function(x){return x.id===id;});
  if(!f) return;
  showToast('Préparation de la facture...');
  var canvas;
  try{
    canvas = await buildFactureCanvas(f);
  }catch(e){
    showToast('Erreur lors de la génération');
    return;
  }
  canvas.toBlob(async function(blob){
    if(!blob){ showToast('Erreur de génération'); return; }
    var file = new File([blob], 'facture_'+f.numero+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({ files:[file], title:'Facture '+f.numero, text:'Facture Dallas Avenue '+f.numero });
        return;
      }catch(e){
        return;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'facture_'+f.numero+'.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Image téléchargée - à partager depuis ta galerie');
  }, 'image/png');
}

function etiquettesHtml(){
  var opts = DB.produits.filter(function(p){ return (p.prixVente||0) > 0; }).map(function(p){ return '<option value="'+p.id+'">'+escHtml(p.nom)+' ('+fmt(p.prixVente)+')</option>'; }).join('');
  var lignes = etiqSel.length ? etiqSel.map(function(x,i){
    var p = DB.produits.find(function(y){return y.id===x.id;});
    return '<div class="item"><div><div class="name">'+escHtml(p?p.nom:'Produit supprimé')+'</div><div class="meta">'+fmt(p?p.prixVente:0)+'</div></div>' +
      '<div class="row" style="gap:6px;"><input type="text" inputmode="none" data-pad="1" value="'+x.qte+'" style="width:70px;" onchange="etiqSetQte('+i+',this.value)">' +
      '<button class="icon-btn danger" onclick="etiqRemove('+i+')">&#128465;</button></div></div>';
  }).join('') : '<div class="empty">Aucun produit choisi.</div>';
  var total = etiqSel.reduce(function(a,x){return a + (parseInt(x.qte,10)||0);},0);
  var pages = Math.max(1, Math.ceil(total / (ETIQ.cols*ETIQ.rows)));
  return '<div class="row" style="margin-bottom:10px;"><button class="btn secondary small" onclick="setProduitsSub(\'ventes\')">&larr; Retour aux ventes</button></div>' +
    '<h2 class="section-title">Étiquettes de rayon</h2>' +
    '<div class="card"><label>Produit</label><select id="etiqProd">'+opts+'</select>' +
      '<label>Nombre d\'étiquettes</label><input type="text" inputmode="none" data-pad="1" id="etiqQte" value="1">' +
      '<button class="btn block" style="margin-top:10px;" onclick="etiqAdd()">Ajouter</button></div>' +
    '<h3 class="sub-title">Choix</h3>' + lignes +
    '<div class="meta" style="margin:10px 0;">'+total+' étiquette(s), soit '+pages+' feuille(s) A4 de '+(ETIQ.cols*ETIQ.rows)+' étiquettes.</div>' +
    '<button class="btn block" onclick="etiqPrint()" '+(total?'':'disabled')+'>Imprimer les étiquettes</button>' +
    '<button class="btn secondary block" style="margin-top:8px;" onclick="etiqPdf()" '+(total?'':'disabled')+'>Partager en PDF (pour l’imprimeur)</button>' +
    (etiqSel.length?'<button class="btn secondary block" style="margin-top:8px;" onclick="etiqVider()">Vider la liste</button>':'');
}
function etiqAdd(){
  var id = document.getElementById('etiqProd').value;
  var q = parseInt(document.getElementById('etiqQte').value,10);
  if(!q || q<1){ showToast('Indique un nombre d\'étiquettes'); return; }
  var pr = DB.produits.find(function(y){return y.id===id;});
  if(!pr || !(pr.prixVente>0)){ showToast('Ce produit n\'a pas de prix'); return; }
  var ex = etiqSel.find(function(x){return x.id===id;});
  if(ex) ex.qte = (parseInt(ex.qte,10)||0) + q; else etiqSel.push({id:id, qte:q});
  renderers.produits();
}
function etiqRemove(i){ etiqSel.splice(i,1); renderers.produits(); }
function etiqSetQte(i,v){ var q=parseInt(v,10); if(q>0) etiqSel[i].qte=q; else etiqSel.splice(i,1); renderers.produits(); }
function etiqVider(){ etiqSel = []; renderers.produits(); }
var etiqCtx = document.createElement('canvas').getContext('2d');
function etiqFitPt(texte, poids, maxPt, minPt, maxMm){
  etiqCtx.font = poids + ' 100px Arial';
  var w = etiqCtx.measureText(texte).width / 100;
  var pt = (maxMm * 72 / 25.4) / (w || 1);
  return Math.max(minPt, Math.min(maxPt, pt));
}
function etiqLabels(){
  var labels = [], sansPrix = [];
  etiqSel.forEach(function(x){
    var p = DB.produits.find(function(y){return y.id===x.id;});
    if(!p) return;
    if(!(p.prixVente>0)){ sansPrix.push(p.nom); return; }
    for(var k=0;k<(parseInt(x.qte,10)||0);k++) labels.push(p);
  });
  if(sansPrix.length) showToast('Sans prix, non imprimé : ' + sansPrix.join(', '));
  return labels;
}
function etiqPrint(){
  var labels = etiqLabels();
  if(!labels.length){ showToast('Choisis au moins un produit avec un prix'); return; }
  var per = ETIQ.cols*ETIQ.rows, pagesHtml = '';
  for(var pg=0; pg*per < labels.length; pg++){
    var cells = '';
    for(var c=0;c<per;c++){
      var lab = labels[pg*per+c];
      if(!lab){ cells += '<div class="e" style="background-image:none"></div>'; continue; }
      var nomU = String(lab.nom).toUpperCase(), prixT = Math.round(lab.prixVente).toLocaleString('fr-FR') + ' FCFA';
      var tailleN = etiqFitPt(nomU, 'bold', 14, 6, 61).toFixed(1) + 'pt', tailleP = etiqFitPt(prixT, 'bold', 34, 10, 62).toFixed(1) + 'pt';
      cells += '<div class="e"><div class="ln" style="font-size:'+tailleN+'">'+escHtml(nomU)+'</div><div class="lp" style="font-size:'+tailleP+'">'+escHtml(prixT)+'</div></div>';
    }
    pagesHtml += '<div class="sheet">'+cells+'</div>';
  }
  var css = '@page{size:A4;margin:0}' +
    'body{margin:0;font-family:Arial,sans-serif;color:#000}' +
    '.sheet{width:210mm;height:297mm;padding:'+ETIQ.marginTop+'mm 0 0 '+ETIQ.marginLeft+'mm;box-sizing:border-box;display:grid;grid-template-columns:repeat('+ETIQ.cols+','+ETIQ.w+'mm);grid-auto-rows:'+ETIQ.h+'mm;page-break-after:always;}' +
    '.e{position:relative;width:'+ETIQ.w+'mm;height:'+ETIQ.h+'mm;box-sizing:border-box;background-image:url("'+ETIQ_BG+'");background-size:100% 100%;background-repeat:no-repeat;overflow:hidden;}' +
    '.ln,.lp{position:absolute;left:4.5%;width:91%;display:flex;align-items:center;justify-content:center;color:#000;white-space:nowrap;overflow:hidden;}' +
    '.ln{top:52.2%;height:15.2%;font-family:Arial,sans-serif;font-weight:bold;}' +
    '.lp{top:69.6%;height:24.6%;font-family:Arial,sans-serif;font-weight:bold;}';
  var html = '<!doctype html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+pagesHtml+'</body></html>';
  var old = document.getElementById('printFrame'); if(old) old.remove();
  var fr = document.createElement('iframe'); fr.id='printFrame';
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(fr);
  var d = fr.contentWindow.document; d.open(); d.write(html); d.close();
  setTimeout(function(){ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ showToast('Impression impossible sur cet appareil'); } }, 400);
}

/* PDF écrit directement (sans bibliothèque) : fond en JPEG + textes, format A4 */
function etiqBgJpeg(cb){
  var img = new Image();
  img.onload = function(){
    var c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0);
    var url = c.toDataURL('image/jpeg', 0.92);
    cb({ bin: atob(url.split(',')[1]), w: c.width, h: c.height, ctx: c.getContext('2d') });
  };
  img.src = ETIQ_BG;
}
function etiqPdfBytes(labels, bg){
  var PT = 72/25.4, PW = 595.28, PH = 841.89;
  var per = ETIQ.cols*ETIQ.rows, nPages = Math.ceil(labels.length/per);
  var ctx = bg.ctx;
  var esc = function(t){ return String(t).replace(/[\\()]/g, function(m){return '\\'+m;}).replace(/[^\x20-\x7e\xa0-\xff]/g,'?'); };
  var out = [], offs = [], len = 0;
  var push = function(str){ out.push(str); len += str.length; };
  var objs = []; // each entry: string content (binary-safe latin1)
  // object numbering: 1 catalog, 2 pages, 3 font Helvetica-Bold, 4 font Times-BoldItalic, 5 image, then per page: page, content
  var firstPage = 6;
  var kids = [];
  for(var n=0;n<nPages;n++) kids.push((firstPage+2*n)+' 0 R');
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = '<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+nPages+' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  var imgData = bg.bin;
  objs[5] = { dict: '<< /Type /XObject /Subtype /Image /Width '+bg.w+' /Height '+bg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+imgData.length+' >>', stream: imgData };
  ctx.font = 'italic bold 100px Times';
  for(var pg=0; pg<nPages; pg++){
    var ops = '';
    for(var c=0;c<per;c++){
      var lab = labels[pg*per+c]; if(!lab) continue;
      var col = c % ETIQ.cols, row = Math.floor(c / ETIQ.cols);
      var x = (ETIQ.marginLeft + col*ETIQ.w)*PT, top = (ETIQ.marginTop + row*ETIQ.h)*PT;
      var w = ETIQ.w*PT, h = ETIQ.h*PT, y = PH - top - h;
      ops += 'q '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /Im0 Do Q\n';
      // nom (bande du haut)
      var nom = String(lab.nom).toUpperCase();
      var size = etiqFitPt(nom, 'bold', 14, 6, 61);
      ctx.font = 'bold 100px Arial';
      var wn = ctx.measureText(nom).width / 100 * size;
      var yn = PH - (top + 0.598*h) - size*0.35;
      ops += 'BT 0 0 0 rg /F2 '+size.toFixed(1)+' Tf '+(x + w/2 - wn/2).toFixed(2)+' '+yn.toFixed(2)+' Td ('+esc(nom)+') Tj ET\n';
      // prix (bande du bas)
      var prix = Math.round(lab.prixVente).toLocaleString('fr-FR').replace(/[\u202f\u00a0]/g,' ') + ' FCFA';
      var psz = etiqFitPt(prix, 'bold', 34, 10, 62);
      ctx.font = 'bold 100px Arial';
      var wp = ctx.measureText(prix).width / 100 * psz;
      var yp = PH - (top + 0.819*h) - psz*0.35;
      ops += 'BT 0 0 0 rg /F1 '+psz.toFixed(1)+' Tf '+(x + w/2 - wp/2).toFixed(2)+' '+yp.toFixed(2)+' Td ('+esc(prix)+') Tj ET\n';
    }
    objs[firstPage+2*pg] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 5 0 R >> /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(firstPage+2*pg+1)+' 0 R >>';
    objs[firstPage+2*pg+1] = { dict: '<< /Length '+ops.length+' >>', stream: ops };
  }
  var total = firstPage + 2*nPages - 1;
  var pdf = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  var xref = [];
  for(var k=1;k<=total;k++){
    var o = objs[k]; if(!o) continue;
    xref[k] = pdf.length;
    if(typeof o === 'string') pdf += k+' 0 obj\n'+o+'\nendobj\n';
    else pdf += k+' 0 obj\n'+o.dict+'\nstream\n'+o.stream+'\nendstream\nendobj\n';
  }
  var xrefPos = pdf.length;
  pdf += 'xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(var q=1;q<=total;q++){ var e = xref[q]; pdf += (e===undefined?'0000000000 65535 f ':(('0000000000'+e).slice(-10)+' 00000 n '))+'\n'; }
  pdf += 'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xrefPos+'\n%%EOF';
  var bytes = new Uint8Array(pdf.length);
  for(var b=0;b<pdf.length;b++) bytes[b] = pdf.charCodeAt(b) & 255;
  return bytes;
}

function categoriesProduits(){

}

function reduirePhoto(dataUrl, max){
  return new Promise(function(resolve){
    if(!dataUrl){ resolve(null); return; }
    var img = new Image();
    img.onload = function(){
      var r = Math.min(1, max/Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = function(){ resolve(null); };
    img.src = dataUrl;
  });
}
function ghConfig(){
  var t='',r='';
  try{ t=localStorage.getItem('da_gh_token')||''; r=localStorage.getItem('da_gh_repo')||''; }catch(e){}
  return {token:t, repo:r||'NIORO762/NIORO762.github.io'};
}
function ghSave(){
  var r=(document.getElementById('ghRepo').value||'').trim(), t=(document.getElementById('ghToken').value||'').trim();
  try{
    if(r) localStorage.setItem('da_gh_repo', r);
    if(t) localStorage.setItem('da_gh_token', t);
  }catch(e){ showToast('Enregistrement impossible'); return; }
  showToast('Réglages enregistrés'); renderers.produits && renderers.produits();
}
function ghClear(){ try{ localStorage.removeItem('da_gh_token'); }catch(e){} showToast('Clé retirée'); renderers.produits && renderers.produits(); }
async function ghPublish(txt){
  var c=ghConfig(), api='https://api.github.com/repos/'+c.repo+'/contents/boutique.json';
  var h={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'};
  var sha=null, g=await fetch(api,{headers:h});
  if(g.status===200){ sha=(await g.json()).sha; }
  else if(g.status!==404){ throw new Error(g.status===401?'clé refusée':'GitHub '+g.status); }
  var body={message:'Mise à jour de la boutique',content:btoa(unescape(encodeURIComponent(txt)))};
  if(sha) body.sha=sha;
  var r=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
  if(!r.ok){ throw new Error(r.status===401||r.status===403?'clé sans droit d\'écriture':'GitHub '+r.status); }
}
async function publierBoutique(){ if(!isAdmin()){ showToast('Réservé aux administrateurs'); return; }
  if(!DB.produits.length){ showToast('Aucun produit à publier'); return; }
  showToast('Préparation de la boutique...');
  var items = [];
  var pub = DB.produits.filter(function(x){ return x.categorie && String(x.categorie).trim(); });
  if(!pub.length){ showToast('Aucun produit avec une catégorie : rien à publier'); return; }
  for(var i=0;i<pub.length;i++){
    var p = pub[i];
    items.push({
      id: p.id,
      nom: p.nom,
      prix: p.prixVente,
      categorie: p.categorie || '',
      description: p.description || '',
      badge: p.badge || '',
      variantes: variantesProduit(p),
      prixBarre: (p.prixBarre && p.prixBarre > p.prixVente) ? p.prixBarre : 0,
      reste: (stockRestant(p) > 0 && stockRestant(p) <= 3) ? stockRestant(p) : 0,
      dispo: stockRestant(p) > 0,
      photo: (p.photo && p.photo.indexOf('http')===0) ? p.photo : await reduirePhoto(p.photo, 560)
    });
  }
  var payload = { maj: new Date().toISOString(), whatsapp: '22371747415', produits: items };
  var txt = JSON.stringify(payload);
  if(ghConfig().token){
    try{ await ghPublish(txt); try{localStorage.setItem('da_last_pub', new Date().toISOString());}catch(e){} showToast('Boutique mise à jour en ligne ✓ (1 minute environ)'); return; }
    catch(e){ showToast('Échec : '+e.message+' - fichier téléchargé à la place'); }
  }
  var blob = new Blob([txt], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'boutique.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  showToast('boutique.json prêt - à envoyer sur GitHub');
}

function importDataFile(input){
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      if(!confirm('Cela va remplacer toutes les données actuelles par celles du fichier. Continuer ?')){ input.value=''; return; }
      DB.soins = data.soins_catalogue || [];
      DB.journal = data.soins_journal || [];
      DB.produits = data.produits_catalogue || [];
      DB.ventes = data.ventes_produits || [];
      DB.factures = data.factures || [];
      DB.depenses = data.depenses || [];
      DB.dettes = data.dettes_clients || [];
      DB.pertes = data.pertes || [];
      DB.fournisseurs = data.fournisseurs || [];
      DB.achats = data.achats_fournisseurs || [];
      DB.commandes = data.commandes_boutique || [];
      if(data.utilisateurs && data.utilisateurs.length) DB.utilisateurs = data.utilisateurs;
      DB.compteurs = data.compteurs_numerotation || DB.compteurs;
      DB.clients = data.clients_repertoire || [];
      saveKey(KEYS.soins, DB.soins);
      saveKey(KEYS.journal, DB.journal);
      saveKey(KEYS.produits, DB.produits);
      saveKey(KEYS.ventes, DB.ventes);
      saveKey(KEYS.factures, DB.factures);
      saveKey(KEYS.depenses, DB.depenses);
      saveKey(KEYS.dettes, DB.dettes);
      saveKey(KEYS.pertes, DB.pertes);
      saveKey(KEYS.fournisseurs, DB.fournisseurs);
      saveKey(KEYS.achats, DB.achats);
      saveKey(KEYS.commandes, DB.commandes);
      saveKey(KEYS.utilisateurs, DB.utilisateurs);
      saveKey(KEYS.compteurs, DB.compteurs);
      saveKey(KEYS.clients, DB.clients);
      showToast('Données restaurées');
      renderers.finances();
    }catch(err){
      showToast('Fichier invalide');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

/* ================= PRODUITS : filtre, tri, stock ================= */
function norm(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function produitsVisibles(){
  var q = norm(prodQ);
  var arr = DB.produits.filter(function(p){
    if(q && norm(p.nom+' '+(p.categorie||'')).indexOf(q)<0) return false;
    var r = stockRestant(p);
    if(prodFiltre==='bas') return r>0 && r <= (p.seuil==null?5:p.seuil);
    if(prodFiltre==='epuise') return r<=0;
    if(prodFiltre==='promo') return p.prixBarre && p.prixBarre>p.prixVente;
    if(prodFiltre==='sansphoto') return !p.photo;
    return true;
  });
  arr.sort(function(a,b){
    if(prodTri==='stock') return stockRestant(a)-stockRestant(b);
    if(prodTri==='marge') return produitCalc(b).margePct-produitCalc(a).margePct;
    if(prodTri==='ventes') return stockVendu(b.id)-stockVendu(a.id);
    return a.nom.localeCompare(b.nom);
  });
  return arr;
}

function achatEnregistrer(statut){
  if(!achatLignes.length) return;
  var f = DB.fournisseurs.find(function(x){return x.id===achatFourn;});
  var a = { id:uid(), date:document.getElementById('achDate').value||todayISO(), fournisseurId:achatFourn, fournisseurNom:f?f.nom:'',
    lignes:achatLignes.slice(), total:achatLignes.reduce(function(t,l){return t+l.qte*l.prixAchat;},0), statut:'commande', depense:achatDepense };
  DB.achats.push(a); saveKey(KEYS.achats, DB.achats);
  achatLignes = [];
  if(statut==='recu') achatReceptionner(a.id); else { showToast('Commande enregistrée'); renderers.produits(); }

function achatReceptionner(id){
  var a = DB.achats.find(function(x){return x.id===id;}); if(!a || a.statut==='recu') return;
  a.lignes.forEach(function(l){
    var p = DB.produits.find(function(x){return x.id===l.produitId;});
    if(p){ p.stock += l.qte; p.prixAchat = l.prixAchat; }
  });
  a.statut = 'recu'; a.dateRecu = todayISO();
  if(a.depense){ DB.depenses.push({ id:uid(), date:todayISO(), categorie:'Achats', detail:(a.fournisseurNom||'Fournisseur')+' – '+a.lignes.length+' article(s)', montant:a.total, achatId:a.id }); saveKey(KEYS.depenses, DB.depenses); }
  saveKey(KEYS.produits, DB.produits); saveKey(KEYS.achats, DB.achats);
  showToast('Réception enregistrée : stock mis à jour'); renderers.produits();
}
function achatSupprimer(id){
  var a = DB.achats.find(function(x){return x.id===id;});
  if(a && a.statut==='recu'){
    a.lignes.forEach(function(l){ var p = DB.produits.find(function(x){return x.id===l.produitId;}); if(p) p.stock -= l.qte; });
    DB.depenses = DB.depenses.filter(function(d){return d.achatId!==id;}); saveKey(KEYS.depenses, DB.depenses); saveKey(KEYS.produits, DB.produits);
  }
  DB.achats = DB.achats.filter(function(x){return x.id!==id;}); saveKey(KEYS.achats, DB.achats);
  showToast('Achat supprimé'); renderers.produits();
}

function parseMoney(t){ return parseInt(String(t).replace(/[^\d]/g,''),10)||0; }
function analyserCommande(txt){
  var res = { num:'', client:'', tel:'', mode:'', lignes:[], total:0, note:'' };
  var m;
  (txt.match(/[^\n]+/g)||[]).forEach(function(raw){
    var l = raw.trim();
    if((m = /N[°o]\s*(DA-\d{4}-\d{4})/i.exec(l))) res.num = m[1];
    else if((m = /^[-•*]\s*(.+?)\s+x\s*(\d+)\s*=\s*([\d\s\u202f\u00a0.]+)\s*F/i.exec(l))){
      var full = m[1].trim(), base = full.replace(/\s*\(.*\)\s*$/,'').trim(), variant = (/\((.*)\)\s*$/.exec(full)||[])[1]||'';
      var q = parseInt(m[2],10), tot = parseMoney(m[3]);
      var nb = norm(base);
      var p = DB.produits.find(function(x){return norm(x.nom)===nb;}) || DB.produits.find(function(x){return norm(x.nom).indexOf(nb)>=0 || nb.indexOf(norm(x.nom))>=0;});
      res.lignes.push({ nom:base, variante:variant, qte:q, total:tot, produitId:p?p.id:'' });
    }
    else if((m = /^Nom\s*:\s*(.+)/i.exec(l))) res.client = m[1].trim();
    else if((m = /^T[ée]l\s*:\s*(.+)/i.exec(l))) res.tel = m[1].trim();
    else if((m = /^(Livraison|Retrait[^:]*)(?::\s*(.+))?$/i.exec(l))) res.mode = m[1] + (m[2]?' : '+m[2]:'');
    else if((m = /^Pr[ée]cisions\s*:\s*(.+)/i.exec(l))) res.note = m[1].trim();
  });
  res.total = res.lignes.reduce(function(a,l){return a+l.total;},0);
  return res;
}
function cmdAnalyserClick(){
  var t = document.getElementById('cmdTxt').value; cmdTexte = t;
  var r = analyserCommande(t);
  if(!r.lignes.length){ showToast('Aucune ligne de commande reconnue'); cmdAnalyse = null; renderers.produits(); return; }
  cmdAnalyse = r; renderers.produits();
}
function cmdImporter(){
  var r = cmdAnalyse; if(!r) return;
  if(r.num && DB.commandes.some(function(c){return c.num===r.num;})){ showToast('Cette commande est déjà importée'); return; }
  var num = r.num || ('CMD-'+Date.now().toString(36).toUpperCase());
  var manque = r.lignes.filter(function(l){ var p = DB.produits.find(function(x){return x.id===l.produitId;}); return p && l.qte > stockRestant(p); });
  var n = 0;
  r.lignes.forEach(function(l){
    var p = DB.produits.find(function(x){return x.id===l.produitId;}); if(!p) return;
    var c = produitCalc(p), numero = consumeNumero('vente');
    DB.ventes.push({ id:uid(), numero:numero, date:todayISO(), produitId:p.id, produitNom:p.nom + (l.variante?' ('+l.variante+')':''), prixVente:l.total/l.qte,
      coutUnitaire:c.achatTotal, margeUnitaire:l.total/l.qte - c.achatTotal, qte:l.qte, total:l.total, marge:l.total - l.qte*c.achatTotal, client:r.client, commande:num });
    n++;
  });
  DB.commandes.push({ id:uid(), num:num, date:todayISO(), client:r.client, tel:r.tel, mode:r.mode, note:r.note, total:r.total, nbLignes:r.lignes.length, statut:'traiter' });
  if(r.client && !DB.clients.some(function(c){return norm(c.nom)===norm(r.client);})){ DB.clients.push({ id:uid(), nom:r.client, telephone:r.tel, note:'Boutique en ligne' }); saveKey(KEYS.clients, DB.clients); }
  saveKey(KEYS.ventes, DB.ventes); saveKey(KEYS.commandes, DB.commandes);
  cmdAnalyse = null; cmdTexte = '';
  showToast(n+' vente(s) enregistrée(s)' + (manque.length?' – attention stock insuffisant':'')); renderers.produits();
}
function cmdStatut(id){
  var c = DB.commandes.find(function(x){return x.id===id;}); if(!c) return;
  c.statut = c.statut==='traiter' ? 'livree' : 'traiter'; saveKey(KEYS.commandes, DB.commandes); renderers.produits();
}
function cmdSupprimer(id){
  var c = DB.commandes.find(function(x){return x.id===id;});
  if(c){ DB.ventes = DB.ventes.filter(function(v){return v.commande!==c.num;}); saveKey(KEYS.ventes, DB.ventes); }
  DB.commandes = DB.commandes.filter(function(x){return x.id!==id;}); saveKey(KEYS.commandes, DB.commandes);
  showToast('Commande supprimée (stock rétabli)'); renderers.produits();
}

  }).join('') || '<div class="empty">Aucune commande importée.</div>';
  return '<div class="card"><div style="font-weight:600;margin-bottom:4px;">&#128722; Importer une commande WhatsApp</div>' +

    '<button class="btn secondary block" style="margin-top:8px;" onclick="cmdAnalyserClick()">Analyser le message</button></div>' + prev +

}
